<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Parametric generator for a printable balance-bike coasting hill: pick your printer, size the hill, download the STLs.">
<meta name="color-scheme" content="light dark">
<title>Coasting hill generator</title>
<style>/* ---------------------------------------------------------------- tokens -- */
:root {
  --ground:#EDF0EE; --panel:#FFF; --panel-2:#F5F8F6; --sunk:#E4E9E6;
  --line:#D3DAD6; --line-2:#E3E8E5;
  --ink:#16201E; --ink-2:#54605C; --ink-3:#7E8A86;
  --accent:#C9560A; --accent-2:#E9832F; --on-accent:#FFF;
  --support:#2C6B60;
  --ok:#2C7A5B; --warn:#9E5A05; --crit:#A32E22;
  --vp-1:#E9EDEA; --vp-2:#D6DDD9;
  --grid:#98A6A1;
  --shadow:0 1px 2px rgba(22,32,30,.06), 0 8px 24px -12px rgba(22,32,30,.18);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark) {
  :root {
    --ground:#0F1514; --panel:#171F1D; --panel-2:#1D2624; --sunk:#121917;
    --line:#2A3533; --line-2:#212B29;
    --ink:#E3EAE7; --ink-2:#98A5A0; --ink-3:#6B7874;
    --accent:#F2812A; --accent-2:#F79B52; --on-accent:#1A1005;
    --support:#57A294;
    --ok:#4FA97F; --warn:#D08F35; --crit:#D65B4C;
    --vp-1:#141C1A; --vp-2:#0A100F;
    --grid:#3A4744;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --ground:#0F1514; --panel:#171F1D; --panel-2:#1D2624; --sunk:#121917;
  --line:#2A3533; --line-2:#212B29;
  --ink:#E3EAE7; --ink-2:#98A5A0; --ink-3:#6B7874;
  --accent:#F2812A; --accent-2:#F79B52; --on-accent:#1A1005;
  --support:#57A294;
  --ok:#4FA97F; --warn:#D08F35; --crit:#D65B4C;
  --vp-1:#141C1A; --vp-2:#0A100F;
  --grid:#3A4744;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
:root[data-theme="light"] {
  --ground:#EDF0EE; --panel:#FFF; --panel-2:#F5F8F6; --sunk:#E4E9E6;
  --line:#D3DAD6; --line-2:#E3E8E5;
  --ink:#16201E; --ink-2:#54605C; --ink-3:#7E8A86;
  --accent:#C9560A; --accent-2:#E9832F; --on-accent:#FFF;
  --support:#2C6B60;
  --ok:#2C7A5B; --warn:#9E5A05; --crit:#A32E22;
  --vp-1:#E9EDEA; --vp-2:#D6DDD9;
  --grid:#98A6A1;
  --shadow:0 1px 2px rgba(22,32,30,.06), 0 8px 24px -12px rgba(22,32,30,.18);
}

:root { color-scheme:light; }
@media (prefers-color-scheme:dark) { :root { color-scheme:dark; } }
:root[data-theme="dark"] { color-scheme:dark; }
:root[data-theme="light"] { color-scheme:light; }

* { box-sizing:border-box; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

/* ----------------------------------------------------------------- shell -- */
.app { display:grid; grid-template-columns:352px minmax(0,1fr); height:100dvh; }

.rail {
  background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
.rail-scroll { overflow-y:auto; flex:1; min-height:0; padding:0 20px 20px; }

.brand { padding:18px 20px 14px; border-bottom:1px solid var(--line-2); }
.brand h1 {
  margin:0; font-family:var(--mono); font-size:15px; font-weight:600;
  letter-spacing:-.02em; display:flex; align-items:baseline; gap:8px;
}
.brand h1 .mark { color:var(--accent); }
.brand p { margin:5px 0 0; font-size:12.5px; color:var(--ink-2); max-width:34ch; }

/* --------------------------------------------------------------- controls -- */
.group { margin-top:22px; }
.group > h2 {
  margin:0 0 12px; font-family:var(--mono); font-size:10.5px; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  display:flex; align-items:center; gap:10px;
}
.group > h2::after { content:""; flex:1; height:1px; background:var(--line-2); }

.ctrl { display:grid; gap:6px; margin-bottom:16px; }
.ctrl-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.ctrl-top label { font-size:13px; color:var(--ink); }
.ctrl-val {
  font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums;
  color:var(--ink-2); display:flex; align-items:baseline; gap:3px;
}
.ctrl-val input {
  width:4.6em; text-align:right; font:inherit; color:var(--ink);
  background:var(--sunk); border:1px solid transparent; border-radius:4px;
  padding:2px 5px; -moz-appearance:textfield;
}
.ctrl-val input::-webkit-outer-spin-button,
.ctrl-val input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.ctrl-val input:hover { border-color:var(--line); }
.ctrl-val input:focus { border-color:var(--accent); background:var(--panel); outline:none; }
.ctrl-val .u { color:var(--ink-3); font-size:11px; width:2.1em; }

input[type=range] {
  -webkit-appearance:none; appearance:none; width:100%; height:18px;
  background:transparent; margin:0; cursor:ew-resize;
}
input[type=range]::-webkit-slider-runnable-track {
  height:3px; border-radius:2px;
  background:linear-gradient(to right,var(--accent) var(--fill,50%),var(--sunk) var(--fill,50%));
}
input[type=range]::-moz-range-track { height:3px; border-radius:2px; background:var(--sunk); }
input[type=range]::-moz-range-progress { height:3px; border-radius:2px; background:var(--accent); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:15px; height:15px; margin-top:-6px; border-radius:50%;
  background:var(--panel); border:2px solid var(--accent); box-shadow:var(--shadow);
}
input[type=range]::-moz-range-thumb {
  width:13px; height:13px; border-radius:50%; background:var(--panel);
  border:2px solid var(--accent); box-shadow:var(--shadow);
}
.hint { font-size:11.5px; color:var(--ink-3); margin:-1px 0 0; }

/* --------------------------------------------------------------- presets -- */
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip {
  font:inherit; font-size:12px; padding:5px 10px; border-radius:999px; cursor:pointer;
  background:var(--panel-2); color:var(--ink-2);
  border:1px solid var(--line); transition:background .12s, color .12s, border-color .12s;
}
.chip:hover { background:var(--sunk); color:var(--ink); }
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

.swatches { display:flex; gap:7px; flex-wrap:wrap; }
.swatch {
  width:26px; height:26px; border-radius:50%; cursor:pointer; padding:0;
  border:1px solid rgba(0,0,0,.18); box-shadow:inset 0 -3px 6px rgba(0,0,0,.14);
}
.swatch[aria-pressed="true"] { box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }

/* ------------------------------------------------------------------ main -- */
.main { display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-width:0; min-height:0; }
/* Grid items default to min-width:auto, so a wide row of readouts or tiles
   would push the whole page wider instead of scrolling inside itself. */
.readouts, .vp, .plate { min-width:0; }
.tiles { min-width:0; }

.readouts {
  display:flex; gap:0; flex-wrap:wrap; align-items:stretch;
  background:var(--panel); border-bottom:1px solid var(--line);
}
.ro { padding:11px 18px; border-right:1px solid var(--line-2); min-width:0; }
.ro:last-child { border-right:0; }
.ro dt {
  font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 3px;
}
.ro dd {
  margin:0; font-family:var(--mono); font-size:16px; font-variant-numeric:tabular-nums;
  letter-spacing:-.02em; white-space:nowrap;
}
.ro dd .sub { font-size:11.5px; color:var(--ink-2); letter-spacing:0; margin-left:5px; }
.ro.push { margin-left:auto; border-right:0; }

.tag {
  display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.06em;
  text-transform:uppercase; padding:2px 7px; border-radius:3px; vertical-align:2px;
}
.tag.ok { background:color-mix(in srgb,var(--ok) 16%,transparent); color:var(--ok); }
.tag.warn { background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn); }
.tag.crit { background:color-mix(in srgb,var(--crit) 16%,transparent); color:var(--crit); }

/* -------------------------------------------------------------- viewport -- */
.vp { position:relative; background:linear-gradient(var(--vp-1),var(--vp-2)); min-height:0; }
.vp canvas { display:block; width:100%; height:100%; touch-action:none; }
.vp-tl, .vp-br {
  position:absolute; font-family:var(--mono); font-size:11px; color:var(--ink-3);
  pointer-events:none; font-variant-numeric:tabular-nums;
}
.vp-tl { top:12px; left:14px; }
.vp-br { bottom:12px; right:14px; text-align:right; }
.vp-modes { position:absolute; top:10px; right:12px; display:flex; gap:5px; }

/* ----------------------------------------------------------------- tiles -- */
.plate { background:var(--panel); border-top:1px solid var(--line); padding:12px 18px 14px; }
.plate-hd {
  display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:9px;
}
.plate-hd h2 {
  margin:0; font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); font-weight:600;
}
.plate-hd .note { font-size:12px; color:var(--ink-3); }
.tiles { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.tile {
  flex:0 0 auto; text-align:left; cursor:pointer; font:inherit;
  background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
  padding:8px 11px; display:grid; gap:2px; transition:border-color .12s, background .12s;
}
.tile:hover { border-color:var(--ink-3); }
.tile[aria-pressed="true"] { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 8%,var(--panel-2)); }
.tile .n { font-family:var(--mono); font-size:12px; font-weight:600; }
.tile .d {
  font-family:var(--mono); font-size:10.5px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}

/* --------------------------------------------------------------- buttons -- */
.actions { display:grid; gap:8px; margin-top:20px; }
.btn {
  font:inherit; font-size:13px; padding:9px 14px; border-radius:6px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:background .12s, border-color .12s;
}
.btn:hover { background:var(--sunk); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:500; }
.btn.primary:hover { background:var(--accent-2); border-color:var(--accent-2); }
.btn .k { font-family:var(--mono); font-size:11px; opacity:.72; }

.foot { font-size:11.5px; color:var(--ink-3); margin:16px 0 0; }
.foot code {
  font-family:var(--mono); font-size:11px; background:var(--sunk);
  padding:1px 4px; border-radius:3px;
}

/* ---------------------------------------------------------------- mobile -- */
@media (max-width:860px) {
  .app { grid-template-columns:1fr; height:auto; }
  .main { order:-1; height:auto; }
  .vp { height:52vh; min-height:300px; }
  .rail { border-right:0; border-top:1px solid var(--line); }
  .rail-scroll { overflow:visible; }
  .readouts { overflow-x:auto; flex-wrap:nowrap; }
  .ro { flex:0 0 auto; }
  .ro.push { margin-left:0; }
  /* the mode chips would sit on top of the dimension label up here */
  .vp-modes { top:auto; bottom:10px; left:12px; right:auto; flex-wrap:wrap; }
  .vp-br { display:none; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1><span class="mark">&#9698;</span> Coasting hill</h1>
      <p>A roller hill for a toddler on a balance bike, sliced into tiles that fit your printer.</p>
    </div>
    <div class="rail-scroll" id="controls"></div>
  </aside>

  <main class="main">
    <dl class="readouts">
      <div class="ro"><dt>Tiles</dt><dd id="ro-tiles">&mdash;</dd></div>
      <div class="ro"><dt>Largest tile</dt><dd id="ro-largest">&mdash;</dd></div>
      <div class="ro"><dt id="ro-slope-label">Max slope</dt><dd id="ro-slope">&mdash;</dd></div>
      <div class="ro"><dt>Filament</dt><dd id="ro-filament">&mdash;</dd></div>
      <div class="ro"><dt>Print time</dt><dd id="ro-time">&mdash;</dd></div>
      <div class="ro"><dt>Spikes</dt><dd id="ro-spikes">&mdash;</dd></div>
    </dl>

    <div class="vp" id="vp">
      <canvas id="vp-canvas"></canvas>
      <div class="vp-tl" id="vp-dims"></div>
      <div class="vp-modes">
        <button class="chip" type="button" data-mode="assembled" aria-pressed="true">Assembled</button>
        <button class="chip" type="button" data-mode="exploded" aria-pressed="false">Exploded</button>
        <button class="chip" type="button" data-mode="underside" aria-pressed="false">Underside</button>
      </div>
      <div class="vp-br">drag to orbit &middot; scroll to zoom<br>floor grid 100 mm</div>
    </div>

    <section class="plate">
      <div class="plate-hd">
        <h2>Print plate</h2>
        <span class="note" id="plate-note"></span>
      </div>
      <div class="tiles" id="tiles"></div>
    </section>
  </main>
</div>

<script>// ============================================================================
//  geom.js -- the bikeramp.scad model, reimplemented as a mesh generator.
//
//  The tile solid is { (x,y,z) : (x,y) in footprint, 0 <= z <= h(x,y) }, so it
//  needs no CSG: mesh the footprint on a grid whose lines are placed at every
//  dovetail feature edge, clip the few straddling cells against a single
//  half-plane each, and lift the result onto the height field. Adjacent cells
//  cut against the same global line, so the surface stays watertight.
//
//  Runs in node (module.exports) and in the browser (window.BikeRamp).
// ============================================================================
(function (root) {
  'use strict';

  var DEFAULTS = {
    shape: 'roller',   // 'roller' | 'drop' | 'kicker'
    deck: 150,         // drop only: flat run before the edge
    hillLength: 600, hillWidth: 300, hillHeight: 45, humps: 1,
    bevelRun: 90, edgeLip: 1.2,
    bedX: 250, bedY: 250,      // usable bed, after edge margin
    tabDepth: 12, tabNeck: 18, tabTip: 26, fit: 0.35, minTabH: 10,
    spikeLen: 0,       // ground spike protrusion, mm. 0 = no spike mounts
    cell: 8            // target mesh cell size, mm
  };

  // Screw-in ground spikes. The socket is a plain 12-sided blind hole; the
  // spike's coarse thread forms its own groove in it, so it can be backed out.
  var SPIKE = {
    socketR: 7.3, socketDepth: 11, gon: 12,
    roof: 5,           // material left between socket ceiling and riding surface
    scan: 10,          // grid the tile is searched on for its thickest point
    inset: 30,         // keep clear of tile edges and their dovetails
    minor: 6.5, major: 7.45, pitch: 3.0, studH: 10, lead: 2.5,
    chamfer: 1.5, flangeR: 9.0, flangeH: 1.5, coneR: 7.5, tipR: 0.6,
    seg: 72
  };

  // -------------------------------------------------------------- profile ---
  // Three lengthwise profiles. 'roller' comes back down to the ground; 'drop'
  // and 'kicker' both finish at full height, so the far end of the last tile is
  // a vertical face.
  function profX(p, x) {
    var H = p.hillHeight, lip = p.edgeLip, L = p.hillLength, h = H - lip;

    if (p.shape === 'drop') {
      // Smooth rise -- zero slope at the toe and at the deck -- then flat to
      // the edge, where it simply stops.
      var rise = Math.max(1, L - Math.min(p.deck, L * 0.8));
      if (x >= rise) return H;
      var t = Math.min(1, Math.max(0, x / rise));
      return lip + h * 0.5 * (1 - Math.cos(Math.PI * t));
    }

    if (p.shape === 'kicker') {
      // Circular arc, tangent to the ground at the toe, steepest at the lip.
      if (h < 0.01) return lip;
      var R = (L * L + h * h) / (2 * h);
      var xx = Math.min(Math.max(x, 0), L);
      return lip + R - Math.sqrt(Math.max(0, R * R - xx * xx));
    }

    return lip + h / 2 * (1 - Math.cos(2 * Math.PI * p.humps * x / L));
  }
  function profY(p, y) {
    if (p.bevelRun <= 0) return p.hillHeight;
    var t = Math.min(1, Math.max(0, Math.min(y, p.hillWidth - y) / p.bevelRun));
    return p.edgeLip + (p.hillHeight - p.edgeLip) * t;
  }
  function hAt(p, x, y) { return Math.min(profX(p, x), profY(p, y)); }

  // Steepest gradient the rider meets. For a kicker that is the lip, i.e. the
  // takeoff angle; for a drop it is the approach, not the edge itself.
  function maxSlopeDeg(p) {
    var L = p.hillLength, h = p.hillHeight - p.edgeLip, t;
    if (p.shape === 'drop') {
      t = Math.PI * h / (2 * Math.max(1, L - Math.min(p.deck, L * 0.8)));
    } else if (p.shape === 'kicker') {
      if (h < 0.01) return 0;
      var R = (L * L + h * h) / (2 * h);
      t = L / Math.max(1e-9, R - h);
    } else {
      t = Math.PI * p.humps * h / L;
    }
    return Math.atan(t) * 180 / Math.PI;
  }

  // --------------------------------------------------------------- tiling ---
  // Tiles carry a dovetail past their nominal pitch, so the printable span is
  // the bed less one tab. Beds are often oblong (a MK4 is 250x210), so try the
  // tile grid both ways round and keep whichever needs fewer plates.
  function tiling(p) {
    var bx = Math.max(1, p.bedX - p.tabDepth), by = Math.max(1, p.bedY - p.tabDepth);
    var fit = function (a, b) {
      return [Math.max(1, Math.ceil(p.hillLength / a)), Math.max(1, Math.ceil(p.hillWidth / b))];
    };
    var a = fit(bx, by), b = fit(by, bx);
    var turn = b[0] * b[1] < a[0] * a[1];
    var n = turn ? b : a;
    return { nx: n[0], ny: n[1], px: p.hillLength / n[0], py: p.hillWidth / n[1],
             turned: turn };
  }

  function nTabs(span) { return Math.max(1, Math.round(span / 120)); }
  function tabOffsets(span) {
    var n = nTabs(span), out = [];
    for (var k = 0; k < n; k++) out.push((k + 0.5) * span / n);
    return out;
  }
  // Dovetails on a seam at constant x, positioned along y (and vice versa).
  // Skipped where the hill is too thin to make a useful tab.
  function xseamTabs(p, xs, y0, span) {
    return tabOffsets(span).map(function (t) { return y0 + t; })
      .filter(function (q) { return hAt(p, xs, q) >= p.minTabH; });
  }
  function yseamTabs(p, ys, x0, span) {
    return tabOffsets(span).map(function (t) { return x0 + t; })
      .filter(function (q) { return hAt(p, q, ys) >= p.minTabH; });
  }

  // ------------------------------------------------------------- dovetail ---
  function lineIntersect(a, b) {
    var d = a[2] * b[3] - a[3] * b[2];
    var s = ((b[0] - a[0]) * b[3] - (b[1] - a[1]) * b[2]) / d;
    return [a[0] + a[2] * s, a[1] + a[3] * s];
  }
  // Offset a CCW convex polygon outward by g (OpenSCAD's offset(delta=g)).
  function offsetConvexCCW(pts, g) {
    var n = pts.length, lines = [], i;
    for (i = 0; i < n; i++) {
      var a = pts[i], b = pts[(i + 1) % n];
      var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      lines.push([a[0] + (dy / L) * g, a[1] - (dx / L) * g, dx, dy]);
    }
    var out = [];
    for (i = 0; i < n; i++) out.push(lineIntersect(lines[(i - 1 + n) % n], lines[i]));
    return out;
  }

  // A dovetail rooted on a seam. axis 'x' points +X, axis 'y' points +Y.
  // Vertices stay CCW; edges 0 and 2 are always the two slanted flanks.
  function dovetail(p, axis, rootCoord, centre, grow) {
    var n2 = p.tabNeck / 2, t2 = p.tabTip / 2, D = p.tabDepth;
    var pts = [[0, -n2], [D, -t2], [D, t2], [0, n2]];
    if (grow) pts = offsetConvexCCW(pts, grow);
    if (axis === 'y') pts = pts.map(function (q) { return [-q[1], q[0]]; });
    var ox = axis === 'x' ? rootCoord : centre;
    var oy = axis === 'x' ? centre : rootCoord;
    return pts.map(function (q) { return [q[0] + ox, q[1] + oy]; });
  }

  function feature(p, kind, axis, rootCoord, centre, grow) {
    var poly = dovetail(p, axis, rootCoord, centre, grow);
    var xs = poly.map(function (q) { return q[0]; });
    var ys = poly.map(function (q) { return q[1]; });
    // The two flanks mirror across this axis; a grid line on it guarantees each
    // cell is cut by at most one of them.
    var splitAxis = axis === 'x' ? 'y' : 'x';
    var k = splitAxis === 'x' ? 0 : 1;
    var e0 = [poly[0], poly[1]], e2 = [poly[2], poly[3]];
    var m0 = (e0[0][k] + e0[1][k]) / 2, m2 = (e2[0][k] + e2[1][k]) / 2;
    return {

      '  o=vec4(clamp(c*vS,0.0,1.0),1.0);\n' +
      '}';
    var GVS = '#version 300 es\nin vec3 aPos; uniform mat4 uMVP;\n' +
      'void main(){ gl_Position=uMVP*vec4(aPos,1.0); }';
    var GFS = '#version 300 es\nprecision mediump float; uniform vec4 uC; out vec4 o;\n' +
      'void main(){ o=uC; }';

    function shader(src, type) {
      var s = g.createShader(type);
      g.shaderSource(s, src); g.compileShader(s);
      if (!g.getShaderParameter(s, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(s));
      return s;
    }
    function program(vs, fs) {
      var p = g.createProgram();
      g.attachShader(p, shader(vs, g.VERTEX_SHADER));
      g.attachShader(p, shader(fs, g.FRAGMENT_SHADER));
      g.linkProgram(p);
      if (!g.getProgramParameter(p, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(p));
      return p;
    }

    function mul(a, b) {
      var o = new Float32Array(16);
      for (var i = 0; i < 4; i++) for (var j = 0; j < 4; j++) {
        var s = 0;
        for (var k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k];
        o[i * 4 + j] = s;
      }
      return o;
    }
    function perspective(fov, asp, n, f) {
      var t = 1 / Math.tan(fov / 2);
      return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]);
    }
    function lookAt(e, c, u) {
      var z = [e[0]-c[0], e[1]-c[1], e[2]-c[2]];
      var zl = Math.hypot(z[0],z[1],z[2]); z = z.map(function (v) { return v/zl; });
      var x = [u[1]*z[2]-u[2]*z[1], u[2]*z[0]-u[0]*z[2], u[0]*z[1]-u[1]*z[0]];
      var xl = Math.hypot(x[0],x[1],x[2]) || 1; x = x.map(function (v) { return v/xl; });
      var y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
      return new Float32Array([
        x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
        -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),
        -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),
        -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]), 1]);
    }

    function mvp() {
      var c = [(bbox[0]+bbox[3])/2, (bbox[1]+bbox[4])/2, (bbox[2]+bbox[5])/2];
      var r = Math.max(bbox[3]-bbox[0], bbox[4]-bbox[1], bbox[5]-bbox[2]) * 0.62 + 40;
      var d = r * 2.9 * cam.zoom;
      var cp = Math.cos(cam.pitch);
      var e = [c[0]+d*cp*Math.cos(cam.yaw), c[1]+d*cp*Math.sin(cam.yaw), c[2]+d*Math.sin(cam.pitch)];
      var asp = canvas.width / Math.max(1, canvas.height);
      // Tight frustum: the joints are 0.35mm apart and need the depth precision.
      var near = Math.max(r * 0.04, d - r * 2.2), far = d + r * 2.2;
      return mul(perspective(0.72, asp, near, far), lookAt(e, c, [0,0,1]));
    }

    function css(v) {
      var s = getComputedStyle(document.documentElement).getPropertyValue(v).trim();
      var m = /^#([0-9a-f]{6})$/i.exec(s);
      if (!m) return [0.5,0.5,0.5];
      var n = parseInt(m[1], 16);
      return [(n>>16&255)/255, (n>>8&255)/255, (n&255)/255];
    }

    function resize() {
      if (!canvas) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    }

    return {
      init: function (cv) {
        canvas = cv;
        g = cv.getContext('webgl2', { antialias: true, alpha: false });
        if (!g) return false;
        prog = program(VS, FS); gprog = program(GVS, GFS);
        vbo = g.createBuffer(); gvbo = g.createBuffer();
        g.enable(g.DEPTH_TEST);
        g.enable(g.CULL_FACE);
        this.bindPointer();
        return true;
      },
      upload: function (b) {
        bbox = b.bbox; count = b.count;
        g.bindBuffer(g.ARRAY_BUFFER, vbo);
        g.bufferData(g.ARRAY_BUFFER, b.data, g.DYNAMIC_DRAW);
        var gd = gridLines(); gcount = gd.length / 3;
        g.bindBuffer(g.ARRAY_BUFFER, gvbo);
        g.bufferData(g.ARRAY_BUFFER, gd, g.STATIC_DRAW);
      },
      draw: function () {
        if (!g || !bbox) return;
        resize();
        var bg = css('--vp-2');
        g.viewport(0, 0, canvas.width, canvas.height);
        g.clearColor(bg[0], bg[1], bg[2], 1);
        g.clear(g.COLOR_BUFFER_BIT | g.DEPTH_BUFFER_BIT);
        var m = mvp();

        g.useProgram(gprog);
        g.uniformMatrix4fv(g.getUniformLocation(gprog, 'uMVP'), false, m);
        var gc = css('--grid');
        g.uniform4f(g.getUniformLocation(gprog, 'uC'), gc[0], gc[1], gc[2], 0.5);
        g.bindBuffer(g.ARRAY_BUFFER, gvbo);
        var gp = g.getAttribLocation(gprog, 'aPos');
        g.enableVertexAttribArray(gp);
        g.vertexAttribPointer(gp, 3, g.FLOAT, false, 12, 0);
        if (cam.pitch > -0.05) g.drawArrays(g.LINES, 0, gcount);

        g.useProgram(prog);
        g.uniformMatrix4fv(g.getUniformLocation(prog, 'uMVP'), false, m);
        var n = parseInt(state.colour.slice(1), 16);
        g.uniform3f(g.getUniformLocation(prog, 'uColor'),
                    (n>>16&255)/255, (n>>8&255)/255, (n&255)/255);
        g.bindBuffer(g.ARRAY_BUFFER, vbo);
        var ap = g.getAttribLocation(prog, 'aPos'),
            an = g.getAttribLocation(prog, 'aNrm'),
            as = g.getAttribLocation(prog, 'aShade');
        [ap, an, as].forEach(function (a) { g.enableVertexAttribArray(a); });
        g.vertexAttribPointer(ap, 3, g.FLOAT, false, 28, 0);
        g.vertexAttribPointer(an, 3, g.FLOAT, false, 28, 12);
        g.vertexAttribPointer(as, 1, g.FLOAT, false, 28, 24);
        g.drawArrays(g.TRIANGLES, 0, count);
      },
      setPitch: function (v) { cam.pitch = v; },
      bindPointer: function () {
        var pts = new Map(), last = null, pinch = 0;
        canvas.addEventListener('pointerdown', function (e) {
          canvas.setPointerCapture(e.pointerId);
          pts.set(e.pointerId, [e.clientX, e.clientY]);
          last = [e.clientX, e.clientY];
        });
        canvas.addEventListener('pointermove', function (e) {
          if (!pts.has(e.pointerId)) return;
          pts.set(e.pointerId, [e.clientX, e.clientY]);
          if (pts.size >= 2) {
            var a = Array.from(pts.values());
            var d = Math.hypot(a[0][0]-a[1][0], a[0][1]-a[1][1]);
            if (pinch) cam.zoom = Math.min(3, Math.max(0.35, cam.zoom * pinch / d));
            pinch = d;
          } else if (last) {
            cam.yaw -= (e.clientX - last[0]) * 0.008;
            cam.pitch = Math.min(1.5, Math.max(-1.3, cam.pitch + (e.clientY - last[1]) * 0.006));
            last = [e.clientX, e.clientY];
          }
          draw();
        });
        var end = function (e) { pts.delete(e.pointerId); last = null; pinch = 0; };
        canvas.addEventListener('pointerup', end);
        canvas.addEventListener('pointercancel', end);
        canvas.addEventListener('wheel', function (e) {
          e.preventDefault();
          cam.zoom = Math.min(3, Math.max(0.35, cam.zoom * (1 + Math.sign(e.deltaY) * 0.1)));
          draw();
        }, { passive: false });
      }
    };
  })();

  var pending = false;
  function draw() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; gl.draw(); });
  }

  // -------------------------------------------------------------- readouts --
  function slopeWord(d) {
    return d < 9 ? 'very gentle' : d < 15 ? 'gentle' : d < 21 ? 'moderate' : 'steep for a toddler';
  }
  function renderReadouts() {
    var r = result, b = r.biggest.m.size, e = r.estimate;
    var over = Math.max(b[0], b[1]) - r.params.maxPrint;
    $('#ro-tiles').innerHTML = r.tiles.length +
      '<span class="sub">' + r.tiling.nx + '\u00d7' + r.tiling.ny + ' grid</span>';
    $('#ro-largest').innerHTML =
      b.map(function (v) { return Math.round(v); }).join(' \u00d7 ') +
      ' <span class="tag ' + (r.fits ? 'ok' : 'crit') + '">' +
      (r.fits ? 'fits' : '+' + Math.ceil(over) + 'mm over') + '</span>';
    $('#ro-slope-label').textContent = r.slopeLabel;
    $('#ro-slope').innerHTML = r.slope.toFixed(1) + '\u00b0' +
      '<span class="sub">' + slopeWord(r.slope) + '</span>';
    $('#ro-filament').innerHTML = (e.grams / 1000).toFixed(2) +
      '<span class="sub">kg</span>';
    $('#ro-time').innerHTML = '\u2248' + Math.round(e.hours) + '<span class="sub">h</span>';
    $('#ro-spikes').innerHTML = state.spikeLen
      ? r.spikes + '<span class="sub">\u00d7 ' + state.spikeLen + 'mm</span>'
      : '<span class="sub" style="margin:0">none</span>';
    $('#vp-dims').textContent = Math.round(state.hillLength) + ' \u00d7 ' +
      Math.round(state.hillWidth) + ' \u00d7 ' + Math.round(state.hillHeight) + ' mm';
  }

  function renderTiles() {
    var box = $('#tiles');
    box.textContent = '';
    result.tiles.forEach(function (t) {
      var b = el('button', 'tile');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.isolate === t.name));
      b.appendChild(el('span', 'n', t.name.replace('tile_', '')));
      b.appendChild(el('span', 'd', t.m.size.map(function (v) { return Math.round(v); })
        .join('\u00d7') + '  ' +
        Math.round(BR.estimate(t.m, { infill: state.infill }).grams) + 'g'));
      b.addEventListener('click', function () {
        state.isolate = state.isolate === t.name ? null : t.name;
        renderTiles(); gl.upload(buildBuffers()); draw();
      });
      box.appendChild(b);
    });
    $('#plate-note').textContent = state.isolate
      ? 'Showing ' + state.isolate + ' \u2014 click again for the whole hill'
      : 'Click a tile to isolate it';
  }

  // -------------------------------------------------------------- controls --
  var bedInputs = null;

  function printerPicker() {
    var wrap = document.createDocumentFragment();
    var bx = el('input'), by = el('input');

    var pick = el('div', 'ctrl');
    var ptop = el('div', 'ctrl-top');
    var plab = el('label', null, 'Printer');
    plab.htmlFor = 'printer';
    ptop.appendChild(plab);
    var sel = el('select', 'select');
    sel.id = 'printer';
    PRINTERS.forEach(function (pr, i) {
      var o = el('option', null, pr.name + '  \u2014  ' + pr.x + '\u00d7' + pr.y + ' mm');
      o.value = String(i);
      sel.appendChild(o);
    });
    var custom = el('option', null, 'Custom');
    custom.value = 'custom';
    sel.appendChild(custom);
    sel.addEventListener('change', function () {
      if (sel.value === 'custom') return;
      var pr = PRINTERS[Number(sel.value)];
      state.bedX = pr.x - BED_MARGIN;
      state.bedY = pr.y - BED_MARGIN;
      bx.value = state.bedX;
      by.value = state.bedY;
      syncPrinter();
      rebuild();
    });
    pick.appendChild(ptop);
    pick.appendChild(sel);
    wrap.appendChild(pick);

    var bed = el('div', 'ctrl');
    var btop = el('div', 'ctrl-top');
    var blab = el('label', null, 'Usable bed');
    blab.htmlFor = 'bed-x';
    var val = el('div', 'ctrl-val');
    [[bx, 'bed-x', 'along the run'], [by, 'bed-y', 'across the width']]
      .forEach(function (d, i) {
        d[0].type = 'number'; d[0].id = d[1];
        d[0].min = 80; d[0].max = 700; d[0].step = 1;
        d[0].setAttribute('aria-label', 'Usable bed ' + d[2]);
        d[0].addEventListener('change', function () {
          var v = parseFloat(d[0].value);
          if (isNaN(v)) { d[0].value = i ? state.bedY : state.bedX; return; }
          v = Math.min(700, Math.max(80, v));
          d[0].value = v;
          state[i ? 'bedY' : 'bedX'] = v;
          syncPrinter();
          rebuild();
        });
        val.appendChild(d[0]);
        if (!i) val.appendChild(el('span', 'x', '\u00d7'));
      });
    val.appendChild(el('span', 'u', 'mm'));
    btop.appendChild(blab); btop.appendChild(val);
    bed.appendChild(btop);
    var bedHint = el('p', 'hint');
    bed.appendChild(bedHint);
    wrap.appendChild(bed);

    bedInputs = { sel: sel, x: bx, y: by, hint: bedHint };
    return wrap;
  }

  function syncPrinter() {
    if (!bedInputs) return;
    var hit = -1;
    PRINTERS.forEach(function (pr, i) {
      if (hit < 0 && pr.x - BED_MARGIN === state.bedX && pr.y - BED_MARGIN === state.bedY)
        hit = i;
    });
    bedInputs.sel.value = hit < 0 ? 'custom' : String(hit);
    bedInputs.x.value = state.bedX;
    bedInputs.y.value = state.bedY;
    bedInputs.hint.textContent =
      'Bed less ' + BED_MARGIN + ' mm of edge margin, along the run \u00d7 across ' +
      'the width. Tiles get turned on the plate when that saves one.' +
      (hit >= 0 && PRINTERS[hit].note ? ' ' + PRINTERS[hit].note : '');
  }

  function shapePicker() {
    var wrap = document.createDocumentFragment();
    var c = el('div', 'ctrl');
    var chips = el('div', 'chips');
    var hint = el('p', 'hint');
    SHAPES.forEach(function (sh) {
      var b = el('button', 'chip', sh.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.shape === sh.v));
      b.addEventListener('click', function () {
        state.shape = sh.v;
        Array.prototype.forEach.call(chips.children, function (o) {
          o.setAttribute('aria-pressed', String(o === b));
        });
        syncInputs(); rebuild(); markPreset();
      });
      chips.appendChild(b);
    });
    c.appendChild(chips);
    c.appendChild(hint);
    wrap.appendChild(c);
    shapeChips = { chips: chips, hint: hint };
    return wrap;
  }

  var shapeChips = null;
  function syncShape() {
    if (!shapeChips) return;
    SHAPES.forEach(function (sh, i) {
      shapeChips.chips.children[i]
        .setAttribute('aria-pressed', String(state.shape === sh.v));
      if (state.shape === sh.v) shapeChips.hint.textContent = sh.hint;
    });
  }

  function spikeGroup() {
    var host = document.createDocumentFragment();
    var sg = el('div', 'group');
    sg.appendChild(el('h2', null, 'Ground spikes'));
    var schips = el('div', 'chips');
    SPIKE_OPTS.forEach(function (o) {
      var c = el('button', 'chip', o.label);
      c.type = 'button';
      c.setAttribute('aria-pressed', String(state.spikeLen === o.v));
      c.addEventListener('click', function () {
        state.spikeLen = o.v;
        Array.prototype.forEach.call(schips.children, function (q) {
          q.setAttribute('aria-pressed', String(q === c));
        });
        rebuild();
      });
      schips.appendChild(c);
    });
    sg.appendChild(schips);
    sg.appendChild(el('p', 'hint',
      'Adds one blind socket under each tile that is thick enough, plus a ' +
      'screw-in spike to print. Grips grass; take them out for indoors. The ' +
      'flange holds the hill 3 mm off the ground.'));
    host.appendChild(sg);
    return host;

  }

  function buildControls() {
    var host = $('#controls');

    var pg = el('div', 'group');
    pg.appendChild(el('h2', null, 'Start from'));
    var chips = el('div', 'chips');
    Object.keys(PRESETS).forEach(function (name) {
      var c = el('button', 'chip', name);
      c.type = 'button';
      c.addEventListener('click', function () {
        Object.assign(state, PRESETS[name]);
        syncInputs(); rebuild(); markPreset();
      });
      c.dataset.preset = name;
      chips.appendChild(c);
    });
    pg.appendChild(chips);
    host.appendChild(pg);

    CONTROLS.forEach(function (grp) {
      var g = el('div', 'group');
      g.appendChild(el('h2', null, grp.group));
      if (grp.custom === 'printer') g.appendChild(printerPicker());
      if (grp.custom === 'shape') g.appendChild(shapePicker());
      grp.items.forEach(function (it) {
        var c = el('div', 'ctrl');
        var top = el('div', 'ctrl-top');
        var lab = el('label', null, it.label);
        lab.htmlFor = 'n-' + it.k;
        var val = el('div', 'ctrl-val');
        var num = el('input');
        num.type = 'number'; num.id = 'n-' + it.k;
        num.min = it.pct ? it.min * 100 : it.min;
        num.max = it.pct ? it.max * 100 : it.max;
        num.step = it.pct ? 1 : it.step;
        val.appendChild(num);
        val.appendChild(el('span', 'u', it.unit));
        top.appendChild(lab); top.appendChild(val);

        var rng = el('input');
        rng.type = 'range'; rng.min = it.min; rng.max = it.max; rng.step = it.step;
        rng.setAttribute('aria-label', it.label);

        c.appendChild(top); c.appendChild(rng);
        if (it.hint) c.appendChild(el('p', 'hint', it.hint));
        g.appendChild(c);
        it._el = c;

        var set = function (v, from) {
          v = Math.min(it.max, Math.max(it.min, v));
          state[it.k] = v;
          if (from !== 'range') rng.value = v;
          if (from !== 'num') num.value = it.pct ? Math.round(v * 100) : v;
          rng.style.setProperty('--fill', ((v - it.min) / (it.max - it.min) * 100) + '%');
          rebuild(); markPreset();
        };
        rng.addEventListener('input', function () { set(parseFloat(rng.value), 'range'); });
        num.addEventListener('change', function () {
          var v = parseFloat(num.value);
          if (!isNaN(v)) set(it.pct ? v / 100 : v, 'num');
        });
        it._set = set;
      });
      host.appendChild(g);
      if (grp.group === 'Hill') host.appendChild(spikeGroup());
    });

    var fg = el('div', 'group');
    fg.appendChild(el('h2', null, 'Filament colour'));
    var sw = el('div', 'swatches');
    FILAMENTS.forEach(function (hex) {
      var b = el('button', 'swatch');
      b.type = 'button'; b.style.background = hex;
      b.setAttribute('aria-label', 'Preview in ' + hex);
      b.setAttribute('aria-pressed', String(state.colour === hex));
      b.addEventListener('click', function () {
        state.colour = hex;
        Array.prototype.forEach.call(sw.children, function (o) {
          o.setAttribute('aria-pressed', String(o === b));
        });
        draw();
      });
      sw.appendChild(b);
    });
    fg.appendChild(sw);
    host.appendChild(fg);

    var ag = el('div', 'actions');
    var d1 = el('button', 'btn primary');
    d1.type = 'button';
    d1.innerHTML = 'Download all tiles <span class="k">.zip</span>';
    d1.addEventListener('click', downloadZip);
    var d2 = el('button', 'btn');
    d2.type = 'button';
    d2.innerHTML = 'Download OpenSCAD source <span class="k">.scad</span>';
    d2.addEventListener('click', downloadScad);
    ag.appendChild(d1); ag.appendChild(d2);
    host.appendChild(ag);

    var f = el('p', 'foot');
    f.innerHTML = 'Slice with 3 walls, 6 top / 4 bottom layers, gyroid infill, ' +
      'no supports, a 5&nbsp;mm brim. <strong>PLA indoors only</strong> \u2014 it sags ' +
      'in a hot garage or a sunny car; use PETG or ASA outdoors.';
    host.appendChild(f);

    syncInputs();
    syncPrinter();
  }

  function syncInputs() {
    CONTROLS.forEach(function (g) {
      g.items.forEach(function (it) { if (it._set) it._set(state[it.k]); });
    });
  }
  // Controls that only mean something for one shape are hidden for the others.
  function applyVisibility() {
    CONTROLS.forEach(function (g) {
      g.items.forEach(function (it) {
        if (it._el) it._el.style.display = !it.show || it.show() ? '' : 'none';
      });
    });
  }
  function markPreset() {
    document.querySelectorAll('[data-preset]').forEach(function (c) {
      var p = PRESETS[c.dataset.preset];
      var on = Object.keys(p).every(function (k) {
        return typeof p[k] === 'string' ? state[k] === p[k]
                                        : Math.abs(state[k] - p[k]) < 1e-9;
      });
      c.setAttribute('aria-pressed', String(on));
    });
  }

  // ---------------------------------------------------------------- export --
  function save(blob, name) {
    var a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  }

  function slug() {
    return 'hill_' + Math.round(state.hillLength) + 'x' + Math.round(state.hillWidth) +
           'x' + Math.round(state.hillHeight);
  }

  function readme() {
    var r = result, e = r.estimate;
    return [
      'Balance-bike coasting hill', '',
      'Shape       ' + (state.shape === 'drop'
        ? 'step drop -- rise, ' + state.deck + ' mm deck, then a ' +
          Math.round(state.hillHeight) + ' mm vertical edge'
        : state.shape === 'kicker'
        ? 'curved jump -- launch ramp, vertical behind the lip'
        : 'roller -- ' + state.humps + ' hump(s), up and back down'),
      'Size        ' + Math.round(state.hillLength) + ' x ' + Math.round(state.hillWidth) +
        ' x ' + Math.round(state.hillHeight) + ' mm',
      r.slopeLabel.padEnd(11) + ' ' + r.slope.toFixed(1) + ' deg (' + slopeWord(r.slope) + ')',
      'Tiles       ' + r.tiles.length + '  (' + r.tiling.nx + ' along the run x ' +
        r.tiling.ny + ' across)',
      'Largest     ' + r.biggest.m.size.map(function (v) { return Math.round(v); }).join(' x ') +
        ' mm  (bed set to ' + state.bedX + ' x ' + state.bedY + ' mm)' +
        (r.turn ? '  -- turn it on the plate' : ''),
      'Spikes      ' + (state.spikeLen
        ? r.spikes + ' sockets, ' + state.spikeLen + ' mm spike'
        : 'none'),
      'Filament    ~' + (e.grams / 1000).toFixed(2) + ' kg at ' +
        Math.round(state.infill * 100) + '% infill',
      'Print time  ~' + Math.round(e.hours) + ' h  (rough \u2014 slice one tile to confirm)', '',
      'Slicing',
      '  0.28 mm layers, 3 walls, 6 top / 4 bottom layers, gyroid infill.',
      '  No supports needed. Add a ~5 mm brim; the footprints are broad and flat.',
      '  PLA indoors only. It softens around 55-60 C, so a hot garage or a sunny',
      '  car will deform it. Use PETG or ASA if it lives outside.', '',
      'Assembly',
      '  tile_IJ: I = position along the run, J = across the width.',
      '  Label each tile as it comes off the plate; they look alike and only one',
      '  arrangement is right.',
      '  Tiles drop straight down into place. The dovetails lock them horizontally,',
      '  so nothing needs sliding and any tile can go in at any time.',
      '  Sockets carry ' + state.fit.toFixed(2) + ' mm clearance per side. If a joint is',
      '  tight, pare the socket walls rather than reprinting.', '',
      'Before he rides it',
    ].concat(state.shape === 'roller' ? [] : [
      state.shape === 'drop'
        ? '  This one ends in a ' + Math.round(state.hillHeight) +
          ' mm vertical edge. Leave clear flat run-out past it,'
        : '  This one launches. Leave clear flat run-out past the lip,',
      '  and note the back of it is a wall if he rides at it the wrong way round.',
    ]).concat([
      '  The dovetails hold tiles to each other but not to the ground. On a hard',
      '  floor the whole hill will skate. Stick rubber pads underneath, run a bead',
      '  of silicone caulk on the undersides, or set it on a rubber-backed rug.',
      '  Check no tile rocks on an uneven floor.',
      '  Helmet.', ''
    ].concat(state.spikeLen ? [
      'Ground spikes',
      '  Print ' + result.spikes + ' of spike_x' + result.spikes + '.stl -- same settings,',
      '  but 4 walls and 40% infill; they are small and take the load.',
      '  Print them stud-down, exactly as oriented. No supports.',
      '  Screw one into each socket. The thread cuts its own groove in the plain',
      '  bore, so the first turn is stiff -- grip the hex flange with pliers if',
      '  you need to. They back out again for indoor use.',
      '  With spikes fitted the hill stands about 3 mm off the ground.', ''
    ] : [])).join('\n');
  }

  function downloadZip() {
    var files = result.tiles.map(function (t) {
      return { name: t.name + '.stl', data: BR.stlBinary(t.tris, t.m.min) };
    });
    var enc = new TextEncoder();
    if (state.spikeLen && result.spikes)
      files.push({ name: 'spike_x' + result.spikes + '.stl',
                   data: BR.stlBinary(BR.spikeMesh(state), [0, 0, 0]) });
    files.push({ name: 'README.txt', data: enc.encode(readme()) });
    files.push({ name: 'bikeramp.scad', data: enc.encode(scadSource()) });
    save(BR.zip(files), slug() + '.zip');
  }

  function scadSource() {
    var map = {
      shape: '"' + state.shape + '"', deck: state.deck,
      hill_length: state.hillLength, hill_width: state.hillWidth,
      hill_height: state.hillHeight, humps: state.humps, bevel_run: state.bevelRun,
      edge_lip: state.edgeLip, bed_x: state.bedX, bed_y: state.bedY,
      fit: state.fit, spike_len: state.spikeLen
    };
    var src = window.SCAD_SOURCE;
    Object.keys(map).forEach(function (k) {
      src = src.replace(new RegExp('^(' + k + '\\s*=\\s*)[^;]+;', 'm'), '$1' + map[k] + ';');
    });
    return src;
  }
  function downloadScad() {
    save(new Blob([scadSource()], { type: 'text/plain' }), 'bikeramp.scad');
  }

  // ------------------------------------------------------------------ boot --
  function boot() {
    var cv = $('#vp-canvas');
    if (!gl.init(cv)) {
      $('#vp').innerHTML = '<p style="padding:24px;color:var(--ink-2)">' +
        'This browser has no WebGL2, so the 3D preview is unavailable. ' +
        'The controls and downloads still work.</p>';
      return;
    }
    document.querySelectorAll('[data-mode]').forEach(function (b) {
      b.addEventListener('click', function () {
        var was = state.mode;
        state.mode = b.dataset.mode;
        document.querySelectorAll('[data-mode]').forEach(function (o) {
          o.setAttribute('aria-pressed', String(o === b));
        });
        if (state.mode === 'underside') gl.setPitch(-0.85);
        else if (was === 'underside') gl.setPitch(0.42);
        gl.upload(buildBuffers()); draw();
      });
    });
    buildControls();
    rebuild();
    markPreset();
    window.addEventListener('resize', draw);
    // The canvas also changes size when the rail wraps or the frame is resized,
    // neither of which fires a window resize.
    if (window.ResizeObserver) new ResizeObserver(draw).observe(cv);
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', draw);
    }
    new MutationObserver(draw).observe(document.documentElement,
      { attributes: true, attributeFilter: ['data-theme'] });
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
