<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Little Ripper: parametric generator for printable balance-bike ramps. Pick your printer, size the ramp, download the STLs.">
<meta name="color-scheme" content="light dark">
<title>Little Ripper &mdash; Ramp Generator</title>
<style>/* ---------------------------------------------------------------- tokens -- */
/* Late-80s freestyle BMX, not synthwave: Haro teal and hot magenta, checkers,
   splatter, heavy italic mastheads with a hard offset shadow. Dark mode is a
   night session under the lights. Light mode is the number plate -- bone white,
   hard black type, the same neons pulled down so they hold on a pale ground. */
:root {
  --ground:#EDEADF; --panel:#FBFAF4; --panel-2:#F3F0E5; --sunk:#E1DDCE;
  --line:#C9C3B0; --line-2:#DEDACB;
  --ink:#15121F; --ink-2:#4E4960; --ink-3:#7C7590;
  --accent:#D6156E; --accent-2:#FF2E88; --on-accent:#FFFFFF;
  --ice:#0C8F88; --zap:#9A6B00; --grape:#6B35D6;
  --ok:#0C8F88; --warn:#9A6B00; --crit:#C8102E;
  --vp-1:#E4E0D2; --vp-2:#D2CDBB;
  --grid:#948DA6;
  --plate:#FBFAF4; --plate-ink:#15121F; --plate-line:#15121F;
  --check-a:#15121F; --check-b:#FBFAF4;
  --shadow:0 2px 0 rgba(21,18,31,.16);
  --hard:3px 3px 0;
  --display:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",
            "Franklin Gothic Bold",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --ground:#0E0B18; --panel:#191430; --panel-2:#221B3D; --sunk:#120E22;
    --line:#332A55; --line-2:#251E42;
    --ink:#F2EFFA; --ink-2:#A79EC4; --ink-3:#7A7099;
    --accent:#FF2E88; --accent-2:#FF63A6; --on-accent:#15121F;
    --ice:#25E3D8; --zap:#FFE14D; --grape:#9B6BFF;
    --ok:#25E3D8; --warn:#FFE14D; --crit:#FF3B5C;
    --vp-1:#141026; --vp-2:#08060F;
    --grid:#2E5F6B;
    --plate:#F5F2E6; --plate-ink:#15121F; --plate-line:#15121F;
    --check-a:#FF2E88; --check-b:#25E3D8;
    --shadow:0 2px 0 rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --ground:#0E0B18; --panel:#191430; --panel-2:#221B3D; --sunk:#120E22;
  --line:#332A55; --line-2:#251E42;
  --ink:#F2EFFA; --ink-2:#A79EC4; --ink-3:#7A7099;
  --accent:#FF2E88; --accent-2:#FF63A6; --on-accent:#15121F;
  --ice:#25E3D8; --zap:#FFE14D; --grape:#9B6BFF;
  --ok:#25E3D8; --warn:#FFE14D; --crit:#FF3B5C;
  --vp-1:#141026; --vp-2:#08060F;
  --grid:#2E5F6B;
  --plate:#F5F2E6; --plate-ink:#15121F; --plate-line:#15121F;
  --check-a:#FF2E88; --check-b:#25E3D8;
  --shadow:0 2px 0 rgba(0,0,0,.5);
}
:root[data-theme="light"] {
  --ground:#EDEADF; --panel:#FBFAF4; --panel-2:#F3F0E5; --sunk:#E1DDCE;
  --line:#C9C3B0; --line-2:#DEDACB;
  --ink:#15121F; --ink-2:#4E4960; --ink-3:#7C7590;
  --accent:#D6156E; --accent-2:#FF2E88; --on-accent:#FFFFFF;
  --ice:#0C8F88; --zap:#9A6B00; --grape:#6B35D6;
  --ok:#0C8F88; --warn:#9A6B00; --crit:#C8102E;
  --vp-1:#E4E0D2; --vp-2:#D2CDBB;
  --grid:#948DA6;
  --plate:#FBFAF4; --plate-ink:#15121F; --plate-line:#15121F;
  --check-a:#15121F; --check-b:#FBFAF4;
  --shadow:0 2px 0 rgba(21,18,31,.16);
}

:root { color-scheme:light; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { color-scheme:dark; } }
:root[data-theme="dark"] { color-scheme:dark; }
:root[data-theme="light"] { color-scheme:light; }

* { box-sizing:border-box; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
:focus-visible { outline:2px solid var(--ice); outline-offset:2px; border-radius:2px; }

/* the checkered flag, used as a rule under the masthead and the plate header */
.checks, .brand::after, .plate::before {
  background-image:
    linear-gradient(45deg, var(--check-a) 25%, transparent 25% 75%, var(--check-a) 75%),
    linear-gradient(45deg, var(--check-a) 25%, transparent 25% 75%, var(--check-a) 75%);
  background-size:12px 12px;
  background-position:0 0, 6px 6px;
  background-color:var(--check-b);
}

/* ----------------------------------------------------------------- shell -- */
.app { display:grid; grid-template-columns:352px minmax(0,1fr); height:100dvh; }

.rail {
  background:var(--panel); border-right:2px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
.rail-scroll { overflow-y:auto; flex:1; min-height:0; padding:0 20px 24px; }

.brand { padding:16px 20px 0; position:relative; }
.brand::after { content:""; display:block; height:12px; margin:12px -20px 0; }
.brand .eyebrow {
  margin:0; font-family:var(--mono); font-size:9.5px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ice);
}
.brand h1 {
  margin:1px 0 0; display:flex; align-items:center; gap:7px;
  font-weight:400; line-height:1;
}
.brand h1 .mark { color:var(--ice); font-size:17px; transform:translateY(-2px); }
.brand h1 .word {
  font-family:var(--display); font-size:33px; letter-spacing:.01em;
  text-transform:uppercase; color:var(--accent);
  transform:skewX(-8deg); display:inline-block;
  text-shadow:var(--hard) var(--ice);
}
.brand p:last-child {
  margin:9px 0 0; font-size:12px; color:var(--ink-2); max-width:36ch;
}

/* --------------------------------------------------------------- controls -- */
.group { margin-top:22px; }
.group > h2 {
  margin:0 0 12px; font-family:var(--mono); font-size:10px; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase; color:var(--ink-2);
  display:flex; align-items:center; gap:10px;
}
.group > h2::after {
  content:""; flex:1; height:3px; background:var(--line-2);
}

.ctrl { display:grid; gap:6px; margin-bottom:16px; }
.ctrl-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.ctrl-top label { font-size:13px; font-weight:600; color:var(--ink); }
.ctrl-val {
  font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums;
  color:var(--ink-2); display:flex; align-items:baseline; gap:3px;
}
.ctrl-val input {
  width:4.6em; text-align:right; font:inherit; font-weight:700; color:var(--ink);
  background:var(--sunk); border:2px solid transparent; border-radius:5px;
  padding:2px 6px; -moz-appearance:textfield;
}
.ctrl-val input::-webkit-outer-spin-button,
.ctrl-val input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.ctrl-val input:hover { border-color:var(--line); }
.ctrl-val input:focus { border-color:var(--ice); background:var(--panel); outline:none; }
.ctrl-val .u { color:var(--ink-3); font-size:10.5px; width:3.4em; letter-spacing:.04em; }

input[type=range] {
  -webkit-appearance:none; appearance:none; width:100%; height:20px;
  background:transparent; margin:0; cursor:ew-resize;
}
input[type=range]::-webkit-slider-runnable-track {
  height:5px; border-radius:0;
  background:linear-gradient(to right,var(--accent) var(--fill,50%),var(--sunk) var(--fill,50%));
}
input[type=range]::-moz-range-track { height:5px; background:var(--sunk); }
input[type=range]::-moz-range-progress { height:5px; background:var(--accent); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px; height:16px; margin-top:-6px; border-radius:3px;
  background:var(--ice); border:2px solid var(--ink); transform:skewX(-10deg);
}
input[type=range]::-moz-range-thumb {
  width:14px; height:14px; border-radius:3px; background:var(--ice);
  border:2px solid var(--ink);
}
.hint { font-size:11.5px; color:var(--ink-3); margin:-1px 0 0; }

/* ------------------------------------------------------- stickers / chips -- */
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip {
  font:inherit; font-size:11.5px; font-weight:700; letter-spacing:.02em;
  padding:5px 11px; border-radius:4px; cursor:pointer;
  background:var(--panel-2); color:var(--ink-2);
  border:2px solid var(--line);
  transition:transform .08s, background .12s, color .12s, border-color .12s;
}
.chip:hover { background:var(--sunk); color:var(--ink); border-color:var(--ink-3); }
.chip[aria-pressed="true"] {
  background:var(--accent); border-color:var(--ink); color:var(--on-accent);
  box-shadow:2px 2px 0 var(--ice); transform:translate(-1px,-1px);
}

.chip.paint { font-size:11px; padding:5px 10px; }
.chip.paint[aria-pressed="true"] { box-shadow:2px 2px 0 var(--ink); transform:translate(-1px,-1px); }
.swatches { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.swatch {
  width:27px; height:27px; border-radius:4px; cursor:pointer; padding:0;
  border:2px solid var(--ink); transform:skewX(-10deg);
}
.swatch[aria-pressed="true"] { box-shadow:2px 2px 0 var(--ice); transform:skewX(-10deg) translate(-1px,-1px); }

/* ------------------------------------------------------------------ main -- */
.main { display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-width:0; min-height:0; }
/* Grid items default to min-width:auto, so a wide row of readouts or plates
   would push the whole page wider instead of scrolling inside itself. */
.readouts, .vp, .plate { min-width:0; }
.tiles { min-width:0; }

.readouts {
  display:flex; gap:0; flex-wrap:wrap; align-items:stretch;
  background:var(--panel); border-bottom:3px solid var(--line);
}
.ro { padding:9px 18px 11px; border-right:2px solid var(--line-2); min-width:0; }
.ro:last-child { border-right:0; }
.ro dt {
  font-family:var(--mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 2px; font-weight:700;
}
.ro dd {
  margin:0; font-family:var(--display); font-size:22px; letter-spacing:.02em;
  white-space:nowrap; color:var(--ink); transform:skewX(-8deg);
  transform-origin:left bottom;
}
.ro dd .sub {
  font-family:var(--mono); font-size:11px; font-weight:700; color:var(--ink-2);
  letter-spacing:0; margin-left:6px; display:inline-block; transform:skewX(8deg);
}

.tag {
  display:inline-block; font-family:var(--mono); font-size:9.5px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; padding:2px 7px; border-radius:3px;
  vertical-align:4px; margin-left:4px; transform:skewX(8deg); border:2px solid currentColor;
}
.tag.ok { color:var(--ok); }
.tag.warn { color:var(--warn); }
.tag.crit { color:var(--on-accent); background:var(--crit); border-color:var(--crit); }

/* -------------------------------------------------------------- viewport -- */
.vp { position:relative; background:linear-gradient(var(--vp-1),var(--vp-2)); min-height:0; }
.vp canvas { display:block; width:100%; height:100%; touch-action:none; }
.vp-tl, .vp-br {
  position:absolute; font-family:var(--mono); font-size:10.5px; color:var(--ink-3);
  pointer-events:none; font-variant-numeric:tabular-nums; letter-spacing:.06em;
}
.vp-tl { top:12px; left:14px; text-transform:uppercase; font-weight:700; color:var(--ice); }
.vp-br { bottom:12px; right:14px; text-align:right; }
.vp-modes { position:absolute; top:10px; right:12px; display:flex; gap:6px; }

/* ---------------------------------------------------------- number plates -- */
.plate {
  background:var(--panel); border-top:3px solid var(--line);
  padding:12px 18px 14px; position:relative;
}
.plate::before { content:""; position:absolute; inset:-3px 0 auto; height:8px; }
.plate-hd {
  display:flex; align-items:baseline; justify-content:space-between; gap:14px;
  margin:6px 0 10px;
}
.plate-hd h2 {
  margin:0; font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink-2); font-weight:700;
}
.plate-hd .note { font-size:11.5px; color:var(--ink-3); }
.tiles { display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; }

/* a BMX race plate: bone rounded rectangle, hard black edge, big italic number */
.tile {
  flex:0 0 auto; text-align:center; cursor:pointer; font:inherit;
  background:var(--plate); border:2px solid var(--plate-line);
  border-radius:12px 12px 9px 9px;
  padding:5px 13px 7px; display:grid; gap:0; justify-items:center;
  box-shadow:2px 2px 0 var(--plate-line);
  transition:transform .08s, box-shadow .08s;
}
.tile:hover { transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--plate-line); }
.tile[aria-pressed="true"] {
  box-shadow:3px 3px 0 var(--accent); border-color:var(--accent);
  transform:translate(-1px,-1px);
}
.tile .n {
  font-family:var(--display); font-size:26px; line-height:1.02; color:var(--plate-ink);
  transform:skewX(-8deg); letter-spacing:.02em;
}
.tile .d {
  font-family:var(--mono); font-size:9.5px; font-weight:700; color:#5C5670;
  font-variant-numeric:tabular-nums; white-space:nowrap; letter-spacing:.02em;
}

/* --------------------------------------------------------------- buttons -- */
.actions { display:grid; gap:9px; margin-top:22px; }
.btn {
  font:inherit; font-size:12.5px; font-weight:700; letter-spacing:.03em;
  padding:10px 14px; border-radius:5px; cursor:pointer;
  border:2px solid var(--ink); background:var(--panel-2); color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:2px 2px 0 var(--ink);
  transition:transform .08s, box-shadow .08s, background .12s;
}
.btn:hover { transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); }
.btn:active { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }
.btn.primary {
  background:var(--accent); color:var(--on-accent); border-color:var(--ink);
  box-shadow:2px 2px 0 var(--ice);
}
.btn.primary:hover { background:var(--accent-2); box-shadow:3px 3px 0 var(--ice); }
.btn .k {
  font-family:var(--mono); font-size:10px; opacity:.8; letter-spacing:.08em;
  text-transform:uppercase;
}

.foot { font-size:11px; color:var(--ink-3); margin:18px 0 0; line-height:1.55; }
.foot strong { color:var(--warn); }
.foot code {
  font-family:var(--mono); font-size:10.5px; background:var(--sunk);
  padding:1px 4px; border-radius:3px;
}

/* --------------------------------------------------------------- selects -- */
.select {
  width:100%; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink);
  background:var(--panel-2); border:2px solid var(--line); border-radius:5px;
  padding:8px 10px; cursor:pointer;
}
.select:hover { border-color:var(--ink-3); }
.select:focus { border-color:var(--ice); outline:none; }
.ctrl-val .x { color:var(--ink-3); font-size:11px; padding:0 1px; }
.text-in {
  width:100%; font-family:var(--display); font-size:19px; letter-spacing:.04em;
  color:var(--accent); background:var(--sunk); border:2px solid var(--line);
  border-radius:5px; padding:5px 9px; text-transform:uppercase;
}
.text-in:focus { border-color:var(--ice); outline:none; background:var(--panel); }

/* ---------------------------------------------------------------- mobile -- */
@media (max-width:860px) {
  .app { grid-template-columns:1fr; height:auto; }
  .main { order:-1; height:auto; }
  .vp { height:52vh; min-height:300px; }
  .rail { border-right:0; border-top:3px solid var(--line); }
  .rail-scroll { overflow:visible; }
  .readouts { overflow-x:auto; flex-wrap:nowrap; }
  .ro { flex:0 0 auto; }
  .ro.push { margin-left:0; }
  /* the mode chips would sit on top of the dimension label up here */
  .vp-modes { top:auto; bottom:10px; left:12px; right:auto; flex-wrap:wrap; }
  .vp-br { display:none; }
  .brand h1 .word { font-size:29px; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }

.build-tabs { margin-bottom:2px; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <p class="eyebrow">Ramp Generator</p>
      <h1><span class="mark">&#9698;</span><span class="word">Little Ripper</span></h1>
      <p>Roller hills, step drops and kickers for a very small bike &mdash;
         cut into tiles that fit your printer.</p>
    </div>
    <div class="rail-scroll" id="controls"></div>
  </aside>

  <main class="main">
    <div class="chips build-tabs" id="build-tabs">
      <button class="chip" type="button" data-build="solid" aria-pressed="true">Solid print</button>
      <button class="chip" type="button" data-build="deck" aria-pressed="false">Plywood deck</button>
    </div>

    <dl class="readouts">
      <div class="ro"><dt id="ro-tiles-label">Tiles</dt><dd id="ro-tiles">&mdash;</dd></div>
      <div class="ro"><dt id="ro-largest-label">Largest tile</dt><dd id="ro-largest">&mdash;</dd></div>
      <div class="ro"><dt id="ro-slope-label">Max slope</dt><dd id="ro-slope">&mdash;</dd></div>
      <div class="ro"><dt>Filament</dt><dd id="ro-filament">&mdash;</dd></div>
      <div class="ro"><dt>Print time</dt><dd id="ro-time">&mdash;</dd></div>
      <div class="ro"><dt id="ro-spikes-label">Spikes</dt><dd id="ro-spikes">&mdash;</dd></div>
    </dl>

    <div class="vp" id="vp">
      <canvas id="vp-canvas"></canvas>
      <div class="vp-tl" id="vp-dims"></div>
      <div class="vp-modes">
        <button class="chip" type="button" data-mode="assembled" aria-pressed="true">Assembled</button>
        <button class="chip" type="button" data-mode="exploded" aria-pressed="false">Exploded</button>
        <button class="chip" type="button" data-mode="underside" aria-pressed="false">Underside</button>
        <button class="chip" type="button" id="bike-toggle" aria-pressed="true">Bike</button>
      </div>
      <div class="vp-br">drag to orbit &middot; scroll to zoom<br>floor grid 100 mm</div>
    </div>

    <section class="plate">
      <div class="plate-hd">
        <h2>Print plate</h2>
        <span class="note" id="plate-note"></span>
      </div>
      <div class="tiles" id="tiles"></div>
    </section>
  </main>
</div>

<script>// ============================================================================
//  geom.js -- the bikeramp.scad model, reimplemented as a mesh generator.
//
//  The tile is a solid between two height fields over a polygonal footprint, so
//  it needs no CSG. Mesh the footprint on a grid whose lines fall on every
//  dovetail, socket and profile kink; clip the few straddling cells against a
//  single half-plane each; split cells that straddle the fold in the surface;
//  then lift the result. Every cut is computed from geometry the neighbouring
//  cell shares, so the mesh stays watertight.
//
//  Two things are not height fields and are built directly: the socket wall,
//  which is lofted so its bore can follow a helix, and the spike itself.
//
//  Runs in node (module.exports) and in the browser (window.BikeRamp).
// ============================================================================
(function (root) {
  'use strict';

  var DEFAULTS = {
    shape: 'roller',   // 'roller' | 'drop' | 'kicker'
    deck: 150,         // drop only: flat run before the edge
    hillLength: 600, hillWidth: 300, hillHeight: 45, humps: 1,
    bevelRun: 90, edgeLip: 1.2,
    bedX: 250, bedY: 250,      // usable bed, after edge margin
    tabDepth: 12, tabNeck: 18, tabTip: 26, fit: 0.12, minTabH: 10,
    spikeLen: 0,       // ground spike protrusion, mm. 0 = no spike mounts
    flow: 8,           // average volumetric throughput, mm^3/s -- see estimate()
    decal: 'none',     // 'none' | 'text' | 'checker' | 'both'
    decalText: 'LITTLE RIPPER',
    decalRelief: 1.2,  // how far the decal stands proud of the flank, mm
    cell: 8,           // coarsest mesh cell, mm. Refined automatically below
    chord: 0.05        // most a flat facet may sag below the true surface, mm
  };

  // Screw-in ground spikes. The socket carries a real matching thread: its wall
  // is lofted rather than extruded, so the bore radius can follow the helix
  // while its rim still lands exactly on the plan polygon.
  var SPIKE = {
    socketDepth: 11, gon: 24,
    roof: 5,           // material left between socket ceiling and riding surface
    scan: 10,          // grid the tile is searched on for its thickest point
    inset: 30,         // keep clear of tile edges and their dovetails

    minor: 6.5, major: 7.45,       // spike thread: root and crest radius
    clear: 0.25,                   // radial clearance, spike to socket
    pitch: 3.0, studH: 10, lead: 2.5,
    threadLead: 1.5,   // plain bore at the mouth, to start the screw
    threadRelief: 1.5, // plain bore at the far end, so the ceiling closes flat

    chamfer: 1.5, flangeR: 9.0, flangeH: 1.5, coneR: 7.5, tipR: 0.6,
    seg: 72, zStep: 0.25
  };
  // The socket is the spike's own profile pushed out by the clearance, so the
  // two forms are identical and mate at every point.
  SPIKE.socketCrestR = SPIKE.minor + SPIKE.clear;   // bore at its tightest
  SPIKE.socketR      = SPIKE.major + SPIKE.clear;   // groove, and the plain bore

  function threadCrest(th, z) {
    var u = z / SPIKE.pitch - th / (2 * Math.PI);
    u -= Math.floor(u);
    return 1 - Math.abs(2 * u - 1);       // symmetric, so handedness cannot bite
  }
  // Material radius on the spike's stud, tapering out over the first turn so
  // the screw starts easily.
  function spikeRadius(th, z) {
    return SPIKE.minor + (SPIKE.major - SPIKE.minor) *

    "J":["####.","...#.","...#.","...#.","...#.","#..#.",".##.."],

    "U":["#...#","#...#","#...#","#...#","#...#","#...#",".###."],

  // one list serves both flanks and each reads the right way round from its own
  // side. Returned as [x0, d0, x1, d1].
  function decalRects(p) {
    if (p.decal === 'none' || p.bevelRun <= 0) return [];
    var out = [], L = p.hillLength, B = p.bevelRun;

    if (p.decal === 'checker' || p.decal === 'both') {
      // Two levels only, split either side of the flank: proud squares meet sunk
      // squares directly, with no strip of original surface between them.
      //
      // Butted exactly, four squares would meet at a point with alternating
      // heights, which no surface can close. So the proud squares alone are
      // grown a hair. They then bridge diagonally at each corner, the sunk ones
      // are held apart by that bridge, and the boundary stays a clean curve.
      // Proud squares are listed first, and the lookup takes the first match,
      // so the overlap resolves to proud.
      var sq = Math.max(6, Math.min(14, B * 0.11));

      // it gets trimmed away; stacked words make a compact block that sits
      // inside one tile.

        .map(function (w) {

        .filter(function (w) { return w.length; });

      // middle, and judge the room available from where the block actually
      // lands rather than from the whole run. Measuring the whole run means a
      // short ramp is judged by its toe, and the text sizes itself out of
      // existence -- which it did below about 500 mm.
      var peakX = span[0], peakH = -1, q;
      for (q = 0; q <= 40; q++) {

          (hmin - p.edgeLip) / Math.max(1e-6, p.hillHeight - p.edgeLip)));
        return { mid: mid, hi: Math.min(hiCap, dFold - 2) };
      };

      // too short to carry it. Shrinking the block pulls it back over the tall
      // part, which makes more room, which is self-correcting -- so walk the
      // size down and take the largest that actually fits.
      var pxA = Math.min((hiCap - lo) / rowsTot, spanW * 0.9 / units);
      var px = 0, hi = 0, mid = 0;

        if (rq.hi - lo >= rowsTot * trial) { px = trial; hi = rq.hi; mid = rq.mid; break; }
      }
      if (px <= 0) return finishRects(p, out);

      var base = lo + ((hi - lo) - rowsTot * px) / 2;

      words.forEach(function (w, li) {

                // instead of a point, without leaving a sliver between rows

  function textSpan(p) {

    for (i = 0; i + 1 < cuts.length; i += 2) {
      var a = cuts[i], b = cuts[i + 1];
      if (b - a < 20) continue;
      var score = profX(p, (a + b) / 2);
      if (!best || score > best.score + 1e-9 ||
          (Math.abs(score - best.score) < 1e-9 && b - a > best.b - best.a))

    return best ? [best.a, best.b] : [0, p.hillLength];
  }

    // reach either side of it. Two reasons. Relief on a tab or in a socket
    // fouls the fit; and a block crossing the tile's plan boundary steps the
    // side wall by the relief at a single point, which is a T-junction. The
    // tiles are separate prints with clearance anyway, so a letter spanning a
    // joint would read as broken however it was meshed.
    var t = tiling(p), pad = p.tabDepth + 1.5, cutX = [], cutD = [], i;

        parts.forEach(function (q) {
          if (q[hi] <= c - gap || q[lo] >= c + gap) { next.push(q); return; }

          if (q[hi] > c + gap) { var b = q.slice(); b[lo] = c + gap; next.push(b); }

        parts = next;

      parts.forEach(function (q) { if (q[hi] - q[lo] > 0.4) out.push(q); });

    return 0;

  // -------------------------------------------------------------- profile ---
  // Three lengthwise profiles. 'roller' comes back down to the ground; 'drop'
  // and 'kicker' both finish at full height, so the far end of the last tile is
  // a vertical face.
  function profX(p, x) {
    var H = p.hillHeight, lip = p.edgeLip, L = p.hillLength, h = H - lip;

    if (p.shape === 'drop') {

      // the edge, where it simply stops.
      var rise = Math.max(1, L - Math.min(p.deck, L * 0.8));
      if (x >= rise) return H;
      var t = Math.min(1, Math.max(0, x / rise));
      return lip + h * 0.5 * (1 - Math.cos(Math.PI * t));

    if (p.shape === 'kicker') {
      // Circular arc, tangent to the ground at the toe, steepest at the lip.
      if (h < 0.01) return lip;
      var R = (L * L + h * h) / (2 * h);
      var xx = Math.min(Math.max(x, 0), L);
      return lip + R - Math.sqrt(Math.max(0, R * R - xx * xx));

    // at full height with ZERO slope at both ends. That is what lets any two
    // modules butt together without a kink in the riding surface.
    if (p.shape === 'rise' || p.shape === 'fall') {
      var tm = Math.min(1, Math.max(0, x / L));
      var c2 = Math.cos(Math.PI * tm);

    // Holding rather than stretching keeps the toe shape and the approach curve
    // intact -- the cosine is simply compressed into what length is left, so a
    // longer flat makes the sides steeper rather than changing their character.
    var lam = L / Math.max(1, p.humps);

  function maxSlopeDeg(p) {

  // cell from the sharpest curvature in the profile. A long gentle hill stays

    return Math.max(1.5, Math.min(p.cell, Math.sqrt(8 * p.chord / k)));

  // --------------------------------------------------------------- tiling ---
  // Tiles carry a dovetail past their nominal pitch, so the printable span is
  // the bed less one tab. Beds are often oblong (a MK4 is 250x210), so try the
  // tile grid both ways round and keep whichever needs fewer plates.
  function tiling(p) {

    var fit = function (a, b) {
      return [Math.max(1, Math.ceil(p.hillLength / a)), Math.max(1, Math.ceil(p.hillWidth / b))];
    };

  function nTabs(span) { return Math.max(1, Math.round(span / 120)); }

  // Dovetails on a seam at constant x, positioned along y (and vice versa).

  function xseamTabs(p, xs, y0, span) {
    return tabOffsets(span).map(function (t) { return y0 + t; })
      .filter(function (q) { return hAt(p, xs, q) >= p.minTabH; });

  function yseamTabs(p, ys, x0, span) {
    return tabOffsets(span).map(function (t) { return x0 + t; })
      .filter(function (q) { return hAt(p, q, ys) >= p.minTabH; });

  // ------------------------------------------------------------- dovetail ---
  function lineIntersect(a, b) {

  // Offset a CCW convex polygon outward by g (OpenSCAD's offset(delta=g)).
  function offsetConvexCCW(pts, g) {
    var n = pts.length, lines = [], i;
    for (i = 0; i < n; i++) {
      var a = pts[i], b = pts[(i + 1) % n];
      var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      lines.push([a[0] + (dy / L) * g, a[1] - (dx / L) * g, dx, dy]);

    var out = [];
    for (i = 0; i < n; i++) out.push(lineIntersect(lines[(i - 1 + n) % n], lines[i]));
    return out;
  }

  // A dovetail rooted on a seam. axis 'x' points +X, axis 'y' points +Y.
  // Vertices stay CCW; edges 0 and 2 are always the two slanted flanks.
  function dovetail(p, axis, rootCoord, centre, grow) {
    var n2 = p.tabNeck / 2, t2 = p.tabTip / 2, D = p.tabDepth;
    var pts = [[0, -n2], [D, -t2], [D, t2], [0, n2]];
    if (grow) pts = offsetConvexCCW(pts, grow);
    if (axis === 'y') pts = pts.map(function (q) { return [-q[1], q[0]]; });
    var ox = axis === 'x' ? rootCoord : centre;

  }

    var poly = dovetail(p, axis, rootCoord, centre, grow);
    var xs = poly.map(function (q) { return q[0]; });
    var ys = poly.map(function (q) { return q[1]; });
    // The two flanks mirror across this axis; a grid line on it guarantees each
    // cell is cut by at most one of them.
    var splitAxis = axis === 'x' ? 'y' : 'x';
    var k = splitAxis === 'x' ? 0 : 1;
    var e0 = [poly[0], poly[1]], e2 = [poly[2], poly[3]];
    var m0 = (e0[0][k] + e0[1][k]) / 2, m2 = (e2[0][k] + e2[1][k]) / 2;
    return {
      kind: kind, poly: poly,
      bbox: [Math.min.apply(null, xs), Math.min.apply(null, ys),
             Math.max.apply(null, xs), Math.max.apply(null, ys)],
      splitAxis: splitAxis, splitAt: centre,
      low: m0 < m2 ? e0 : e2,      // flank on the low side of splitAt
      high: m0 < m2 ? e2 : e0

  }

  // ------------------------------------------------------ tile footprint ----
  function tileFeatures(p, t, i, j) {
    var f = [], x0 = i * t.px, x1 = (i + 1) * t.px, y0 = j * t.py, y1 = (j + 1) * t.py;
    // A module joins the next one exactly the way two tiles join: tabs on the
    // far face, sockets on the near one. xseamTabs already drops any tab where
    // the ramp is too thin to carry it, so a module that ends on the ground
    // simply gets none.
    var mod = p.shape === 'rise' || p.shape === 'flat' || p.shape === 'fall';
    if (i < t.nx - 1 || p.joinEnd || mod) xseamTabs(p, x1, y0, t.py).forEach(function (c) {
      f.push(feature(p, 'tab', 'x', x1, c, 0)); });
    if (j < t.ny - 1) yseamTabs(p, y1, x0, t.px).forEach(function (c) {
      f.push(feature(p, 'tab', 'y', y1, c, 0)); });
    if (i > 0 || p.joinStart || mod) xseamTabs(p, x0, y0, t.py).forEach(function (c) {
      f.push(feature(p, 'socket', 'x', x0, c, p.fit)); });
    if (j > 0) yseamTabs(p, y0, x0, t.px).forEach(function (c) {
      f.push(feature(p, 'socket', 'y', y0, c, p.fit)); });
    return f;
  }

  // ----------------------------------------------------------- half-plane ---
  // Keep the side of directed edge a->b that the CCW interior is on (left),
  // or its complement when cutting a socket away.
  function clipHalf(poly, a, b, keepLeft) {
    if (!poly.length) return poly;
    var s = keepLeft ? 1 : -1;
    var side = function (q) {
      return s * ((b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]));
    };
    var out = [], n = poly.length;
    for (var i = 0; i < n; i++) {
      var c = poly[i], d = poly[(i + 1) % n], sc = side(c), sd = side(d);
      if (sc >= 0) out.push(c);
      if ((sc > 0 && sd < 0) || (sc < 0 && sd > 0)) {
        var u = sc / (sc - sd);
        out.push([c[0] + (d[0] - c[0]) * u, c[1] + (d[1] - c[1]) * u]);
      }
    }
    return out;
  }

  // -------------------------------------------------------- spike sockets ---
  function regularGon(cx, cy, r, n) {
    var pts = [];
    for (var k = 0; k < n; k++) {
      var a = 2 * Math.PI * k / n;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    return pts;                                   // CCW
  }

  function pointInConvex(q, poly) {
    for (var i = 0; i < poly.length; i++) {
      var a = poly[i], b = poly[(i + 1) % poly.length];
      if ((b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]) < 0) return false;
    }
    return true;
  }

  // One socket per tile, at the thickest point of the area that clears the tile
  // edges and their dovetails, scanned on a 10 mm grid. The toes are a
  // millimetre or two thick and get none -- the dovetails tie them to the tiles
  // that are pegged down.
  function spikeSpots(p, t, i, j) {
    if (!p.spikeLen) return [];
    var x0 = i * t.px + SPIKE.inset, x1 = (i + 1) * t.px - SPIKE.inset;
    var y0 = j * t.py + SPIKE.inset, y1 = (j + 1) * t.py - SPIKE.inset;
    if (x1 < x0 || y1 < y0) return [];

    var nx = Math.floor((x1 - x0) / SPIKE.scan), ny = Math.floor((y1 - y0) / SPIKE.scan);
    var best = null;
    for (var a = 0; a <= nx; a++) {
      for (var b = 0; b <= ny; b++) {
        var x = x0 + a * SPIKE.scan, y = y0 + b * SPIKE.scan, h = hAt(p, x, y);
        if (!best || h > best[2] + 1e-9) best = [x, y, h];
      }
    }
    return best && best[2] >= SPIKE.socketDepth + SPIKE.roof ? [[best[0], best[1]]] : [];
  }

  function pocketsFor(p, t, i, j) {
    return spikeSpots(p, t, i, j).map(function (c) {
      var poly = regularGon(c[0], c[1], SPIKE.socketR, SPIKE.gon);
      var xs = poly.map(function (q) { return q[0]; });
      var ys = poly.map(function (q) { return q[1]; });
      var edges = poly.map(function (a, k) {
        var b = poly[(k + 1) % poly.length];
        return { a: a, b: b,
                 box: [Math.min(a[0], b[0]), Math.min(a[1], b[1]),
                       Math.max(a[0], b[0]), Math.max(a[1], b[1])] };
      });
      return {
        poly: poly, edges: edges, depth: SPIKE.socketDepth, c: c,
        bbox: [Math.min.apply(null, xs), Math.min.apply(null, ys),
               Math.max.apply(null, xs), Math.max.apply(null, ys)]
      };
    });
  }

  // ------------------------------------------------------------- crease -----
  // h is min(profX, profY), so the surface folds along the curve where the two
  // are equal. A flat triangle cannot span that fold, and because the fold runs
  // diagonally to the grid it comes out serrated. Split every straddling cell
  // along it: each half then lies on one smooth branch.
  //
  // The cut point on a shared edge is interpolated from that edge's endpoints
  // alone, so the neighbouring cell computes an identical point and the surface
  // stays closed.
  function splitAtCrease(p, poly, rel) {
    var g = poly.map(function (q) { return profX(p, q[0]) - (profY(p, q[1]) + rel); });
    var pos = false, neg = false, i, j;
    for (i = 0; i < g.length; i++) {
      if (g[i] > 0) pos = true;
      if (g[i] < 0) neg = true;
    }
    if (!pos || !neg) return null;

    var A = [], B = [];
    for (i = 0; i < poly.length; i++) {
      j = (i + 1) % poly.length;
      if (g[i] >= 0) A.push(poly[i]);
      if (g[i] <= 0) B.push(poly[i]);
      if ((g[i] > 0 && g[j] < 0) || (g[i] < 0 && g[j] > 0)) {
        var t = g[i] / (g[i] - g[j]);
        var c = [poly[i][0] + (poly[j][0] - poly[i][0]) * t,
                 poly[i][1] + (poly[j][1] - poly[i][1]) * t];
        A.push(c); B.push(c);
      }
    }
    // Validate rather than predict: a vertex sitting exactly on the fold, or a
    // fold that doubles back inside one cell, both break a crossing count. If
    // the two halves do not tile the original, leave the cell alone.
    if (A.length < 3 || B.length < 3) return null;
    var ar = Math.abs(area(poly));
    if (Math.abs(Math.abs(area(A)) + Math.abs(area(B)) - ar) > 1e-6 * (ar + 1))
      return null;
    return [A, B];
  }

  // A vertex landing exactly on a cut line gets emitted by both the clip and
  // the split, leaving a repeated point that fans out into a zero-area
  // triangle. Harmless to a slicer, but it puts four faces on an edge and makes
  // the mesh non-manifold, so drop repeats before building anything.
  function dedupe(poly) {
    var Q = 1e4, out = [], i;
    var same = function (a, b) {
      return Math.round(a[0] * Q) === Math.round(b[0] * Q) &&
             Math.round(a[1] * Q) === Math.round(b[1] * Q);
    };
    for (i = 0; i < poly.length; i++)
      if (!out.length || !same(out[out.length - 1], poly[i])) out.push(poly[i]);
    while (out.length > 1 && same(out[0], out[out.length - 1])) out.pop();
    return out;
  }

  function area(poly) {
    var a = 0;
    for (var i = 0; i < poly.length; i++) {
      var b = poly[(i + 1) % poly.length];
      a += poly[i][0] * b[1] - b[0] * poly[i][1];
    }
    return a / 2;
  }

  // ---------------------------------------------------------- grid lines ----
  function gridLines(lo, hi, critical, cell) {
    var vals = critical.filter(function (v) { return v > lo + 1e-9 && v < hi - 1e-9; });
    vals.push(lo, hi);
    vals.sort(function (a, b) { return a - b; });
    var uniq = [vals[0]];
    for (var i = 1; i < vals.length; i++)
      if (vals[i] - uniq[uniq.length - 1] > 1e-7) uniq.push(vals[i]);
    var out = [uniq[0]];
    for (i = 1; i < uniq.length; i++) {
      var a = uniq[i - 1], b = uniq[i], n = Math.max(1, Math.ceil((b - a) / cell));
      for (var k = 1; k <= n; k++) out.push(a + (b - a) * k / n);
    }
    return out;
  }

  // ---------------------------------------------------------------- mesh ----
  function tileMesh(p, t, i, j) {
    var feats = tileFeatures(p, t, i, j);
    var rx0 = i * t.px, rx1 = (i + 1) * t.px, ry0 = j * t.py, ry1 = (j + 1) * t.py;

    var bx0 = rx0, bx1 = rx1, by0 = ry0, by1 = ry1;
    feats.forEach(function (f) {
      if (f.kind !== 'tab') return;
      bx0 = Math.min(bx0, f.bbox[0]); by0 = Math.min(by0, f.bbox[1]);
      bx1 = Math.max(bx1, f.bbox[2]); by1 = Math.max(by1, f.bbox[3]);
    });

    var pockets = pocketsFor(p, t, i, j);
    var cx = [rx0, rx1], cy = [ry0, ry1];
    feats.forEach(function (f) {
      f.poly.forEach(function (q) { cx.push(q[0]); cy.push(q[1]); });
      (f.splitAxis === 'x' ? cx : cy).push(f.splitAt);
    });
    // A line on every socket vertex leaves each cell crossed by at most one of
    // its edges, so the same single-half-plane split works here too.
    pockets.forEach(function (pk) {
      pk.poly.forEach(function (q) { cx.push(q[0]); cy.push(q[1]); });
    });
    // and on the kinks in the profiles themselves
    if (p.bevelRun > 0) { cy.push(p.bevelRun); cy.push(p.hillWidth - p.bevelRun); }
    // decal blocks are axis-aligned, so a line on each edge makes them crisp
    if (p._decal) p._decal.forEach(function (r) {
      cx.push(r[0], r[2], p.hillLength - r[0], p.hillLength - r[2]);
      cy.push(r[1], r[3], p.hillWidth - r[1], p.hillWidth - r[3]);
    });
    if (p.shape === 'drop')
      cx.push(p.hillLength - Math.min(p.deck, p.hillLength * 0.8));
    var xs = gridLines(bx0, bx1, cx, p.cell);
    var ys = gridLines(by0, by1, cy, p.cell);
    // Split at the fold for every relief in play -- flat, proud and sunk.
    var levels = [0];
    (p._decal || []).forEach(function (r) {
      if (levels.indexOf(r[4]) < 0) levels.push(r[4]);
    });

    var pieces = [];
    for (var a = 0; a < xs.length - 1; a++) {
      for (var b = 0; b < ys.length - 1; b++) {
        var x0 = xs[a], x1 = xs[a + 1], y0 = ys[b], y1 = ys[b + 1];
        var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        var poly = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
        var inside = mx > rx0 && mx < rx1 && my > ry0 && my < ry1;

        for (var k = 0; k < feats.length; k++) {
          var f = feats[k];
          if (mx < f.bbox[0] || mx > f.bbox[2] || my < f.bbox[1] || my > f.bbox[3]) continue;
          var hi = (f.splitAxis === 'x' ? mx : my) > f.splitAt;
          var e = hi ? f.high : f.low;
          if (f.kind === 'tab') { inside = true; poly = clipHalf(poly, e[0], e[1], true); }
        }
        if (!inside) continue;
        for (k = 0; k < feats.length; k++) {
          var g = feats[k];
          if (g.kind !== 'socket') continue;
          if (mx < g.bbox[0] || mx > g.bbox[2] || my < g.bbox[1] || my > g.bbox[3]) continue;
          var hi2 = (g.splitAxis === 'x' ? mx : my) > g.splitAt;
          poly = clipHalf(poly, (hi2 ? g.high : g.low)[0], (hi2 ? g.high : g.low)[1], false);
        }
        if (poly.length < 3) continue;

        var floor = 0, split = null;
        for (k = 0; k < pockets.length; k++) {
          var pk = pockets[k];
          if (mx < pk.bbox[0] || mx > pk.bbox[2] || my < pk.bbox[1] || my > pk.bbox[3])
            continue;
          var cross = pk.edges.filter(function (e) {
            return mx > e.box[0] && mx < e.box[2] && my > e.box[1] && my < e.box[3];
          });
          if (cross.length === 1) { split = { e: cross[0], d: pk.depth }; }
          else if (pointInConvex([mx, my], pk.poly)) { floor = pk.depth; }
          break;
        }

        // Grid lines sit on every decal edge, so a cell is wholly in or out of
        // each block and its centre settles the relief for the whole piece.
        var rel = reliefAt(p, mx, my);
        // Split at the fold for *every* relief level in play, not just this
        // cell's. Near the toes the fold runs through the decal bands, and if
        // each cell split only at its own fold two neighbours would cut their
        // shared edge in different places and tear the mesh open.
        var push = function (q, fl) {
          if (q.length < 3) return;
          var work = [q];
          levels.forEach(function (lv) {
            var next = [];
            work.forEach(function (w) {
              var halves = splitAtCrease(p, w, lv);
              if (!halves) { next.push(w); return; }
              if (halves[0].length >= 3) next.push(halves[0]);
              if (halves[1].length >= 3) next.push(halves[1]);
            });
            work = next;
          });
          work.forEach(function (w) {
            var c = dedupe(w);
            if (c.length >= 3) pieces.push({ poly: c, floor: fl, rel: rel });
          });
        };

        if (split) {
          push(clipHalf(poly, split.e.a, split.e.b, true), split.d);
          push(clipHalf(poly, split.e.a, split.e.b, false), 0);
        } else {
          push(poly, floor);
        }
      }
    }
    return buildSolid(p, pieces, pockets, levels.slice().sort(function (a, b) { return a - b; }));
  }

  // Lift each plan piece onto the height field over its own floor, cap the
  // underside, and wall in whatever a neighbour does not cover: the outside of
  // the tile from floor to surface, and the step wherever two floors differ.
  function buildSolid(p, pieces, pockets, levels) {
    var tris = [], edges = new Map(), Q = 1e4;
    var key = function (x, y) { return Math.round(x * Q) + ':' + Math.round(y * Q); };

    // A triangle with a repeated vertex -- a fan over a duplicated point, a wall
    // whose two heights coincide -- carries an edge and its reverse, so it
    // cancels against itself and can be dropped. Test for that, not for small
    // area: a genuinely thin sliver has three live edges, and deleting it tears
    // a hole in the surface.
    function tri(ax, ay, az, bx, by, bz, cx2, cy2, cz) {
      var q = function (v) { return Math.round(v * 1e4); };
      var A = q(ax) + ',' + q(ay) + ',' + q(az);
      var Bv = q(bx) + ',' + q(by) + ',' + q(bz);
      var C = q(cx2) + ',' + q(cy2) + ',' + q(cz);
      if (A === Bv || Bv === C || C === A) return;
      tris.push(ax, ay, az, bx, by, bz, cx2, cy2, cz);
    }
    // Vertical quad along a->b. Interior lies left of a->b, so this faces out.
    function wall(a, b, za0, zb0, za1, zb1) {
      tri(a[0], a[1], za0, b[0], b[1], zb0, b[0], b[1], zb1);
      tri(a[0], a[1], za0, b[0], b[1], zb1, a[0], a[1], za1);
    }

    // Which socket, if either, this plan edge runs along.
    // Grid lines cut the polygon edges into sub-segments whose ends sit on a
    // chord, inside the circumradius -- so test the whole boundary band, not
    // just the vertices. Getting this wrong leaves some of the rim extruded
    // flat and some lofted, which tears the mesh open.
    function pocketOn(a, b) {
      if (!pockets) return null;
      var inner = SPIKE.socketR * Math.cos(Math.PI / SPIKE.gon) - 0.05;
      var outer = SPIKE.socketR + 0.05;
      var on = function (q, c) {
        var d = Math.hypot(q[0] - c[0], q[1] - c[1]);
        return d >= inner && d <= outer;
      };
      for (var k = 0; k < pockets.length; k++)
        if (on(a, pockets[k].c) && on(b, pockets[k].c)) return pockets[k];
      return null;
    }

    // The socket wall, lofted instead of extruded: each plan point is pushed
    // along its own radius by however much the thread differs from the plain
    // bore. That offset is zero at both ends, so the rim and the ceiling still
    // land exactly on the plan polygon and the mesh stays one closed body.
    function threadWall(pk, a, b, z0, z1) {
      var c = pk.c;
      var ta = Math.atan2(a[1] - c[1], a[0] - c[0]);
      var tb = Math.atan2(b[1] - c[1], b[0] - c[0]);
      var ua = [Math.cos(ta), Math.sin(ta)], ub = [Math.cos(tb), Math.sin(tb)];
      var at = function (q, u, th, z) {
        var d = socketRadius(th, z) - SPIKE.socketR;
        return [q[0] + u[0] * d, q[1] + u[1] * d];
      };
      var zs = [z0], z;
      for (z = z0 + SPIKE.zStep; z < z1 - 1e-9; z += SPIKE.zStep) zs.push(z);
      zs.push(z1);
      for (var k = 0; k < zs.length - 1; k++) {
        var lo = zs[k], hi = zs[k + 1];
        var a0 = at(a, ua, ta, lo), b0 = at(b, ub, tb, lo);
        var a1 = at(a, ua, ta, hi), b1 = at(b, ub, tb, hi);
        tri(a0[0], a0[1], lo, b0[0], b0[1], lo, b1[0], b1[1], hi);
        tri(a0[0], a0[1], lo, b1[0], b1[1], hi, a1[0], a1[1], hi);
      }
    }

    pieces.forEach(function (pc) {
      var poly = pc.poly, f = pc.floor, rel = pc.rel || 0, n = poly.length, i;
      var h = poly.map(function (q) { return topOf(p, rel, q[0], q[1]); });
      // A colour skin's underside follows the flank rather than lying flat, so
      // the floor can be given as a relief level instead of a plane.
      var fr = pc.floorRel;
      var bot = poly.map(function (q) {
        return fr === undefined ? f : topOf(p, fr, q[0], q[1]);
      });
      for (i = 1; i < n - 1; i++) {
        tri(poly[0][0], poly[0][1], h[0],
            poly[i][0], poly[i][1], h[i],
            poly[i + 1][0], poly[i + 1][1], h[i + 1]);                 // surface
        tri(poly[0][0], poly[0][1], bot[0],
            poly[i + 1][0], poly[i + 1][1], bot[i + 1],
            poly[i][0], poly[i][1], bot[i]);                           // underside
      }
      for (i = 0; i < n; i++) {
        var a = poly[i], b = poly[(i + 1) % n];
        var ka = key(a[0], a[1]), kb = key(b[0], b[1]);
        if (ka === kb) continue;
        var rev = kb + '|' + ka;
        if (edges.has(rev)) {
          var o = edges.get(rev);
          edges.delete(rev);
          if (Math.abs(o.f - f) > 1e-9) {          // socket wall
            var lo = f < o.f ? { a: a, b: b, f: f } : { a: o.a, b: o.b, f: o.f };
            var top = Math.max(f, o.f);
            var pk = pocketOn(lo.a, lo.b);
            if (pk) threadWall(pk, lo.a, lo.b, lo.f, top);
            else wall(lo.a, lo.b, lo.f, lo.f, top, top);
          }
          if (Math.abs(o.rel - rel) > 1e-9) {      // decal step, at the surface
            var hh = rel > o.rel ? { a: a, b: b } : { a: o.a, b: o.b };
            var loR = Math.min(rel, o.rel), hiR = Math.max(rel, o.rel);
            // Subdivide at every relief level in between. Where proud, sunk and
            // flat all meet along one line, the tall wall spans what the two
            // shorter ones cover between them; without the split its edge is a
            // T-junction against theirs and the surface will not close.
            var seq = [loR];
            for (var z = 0; z < levels.length; z++)
              if (levels[z] > loR + 1e-9 && levels[z] < hiR - 1e-9) seq.push(levels[z]);
            seq.push(hiR);
            for (z = 0; z + 1 < seq.length; z++)
              wall(hh.a, hh.b,
                   topOf(p, seq[z], hh.a[0], hh.a[1]), topOf(p, seq[z], hh.b[0], hh.b[1]),
                   topOf(p, seq[z + 1], hh.a[0], hh.a[1]),
                   topOf(p, seq[z + 1], hh.b[0], hh.b[1]));
          }
        } else edges.set(ka + '|' + kb, { a: a, b: b, f: f, rel: rel,
                                          fr: fr, ba: bot[i], bb: bot[(i + 1) % n] });
      }
    });

    edges.forEach(function (e) {
      var a = e.a, b = e.b, r = e.rel || 0;
      var z0 = e.fr === undefined ? e.f : e.ba, z1 = e.fr === undefined ? e.f : e.bb;
      wall(a, b, z0, z1, topOf(p, r, a[0], a[1]), topOf(p, r, b[0], b[1]));
    });
    return tris;
  }

  // ------------------------------------------------------- colour bodies ----
  // For AMS printing: a thin skin sitting just under the visible surface of one
  // relief level, following the flank. It overlaps the tile rather than being
  // cut from it -- a slicer resolves overlapping parts of one object in favour
  // of the later part, so the tile itself is unchanged and still prints alone.
  //
  // Top and bottom are the same height field at two levels, so where the riding
  // surface clamps the relief the skin closes to nothing on its own.
  function decalBody(p, t, i, j, rel, skin) {
    var all = p._decal || [];
    if (!all.some(function (r) { return Math.abs(r[4] - rel) < 1e-9; })) return [];
    // Grid lines come from *every* block, not just this level's. The proud
    // blocks are grown, and it is that sliver of overgrowth which holds diagonal
    // sunk squares apart -- without a line on it the two sunk cells meet at a
    // point and the body will not close.
    var foot = [];
    all.forEach(function (r) {
      foot.push([r[0], r[1], r[2], r[3]]);
      foot.push([p.hillLength - r[2], p.hillWidth - r[3],
                 p.hillLength - r[0], p.hillWidth - r[1]]);     // the far flank
    });

    var rx0 = i * t.px, rx1 = (i + 1) * t.px, ry0 = j * t.py, ry1 = (j + 1) * t.py;
    var cx = [rx0, rx1], cy = [ry0, ry1];
    foot.forEach(function (r) { cx.push(r[0], r[2]); cy.push(r[1], r[3]); });
    var xs = gridLines(rx0, rx1, cx, p.cell);
    var ys = gridLines(ry0, ry1, cy, p.cell);

    var pieces = [], a, b, k;
    for (a = 0; a < xs.length - 1; a++) {
      for (b = 0; b < ys.length - 1; b++) {
        var mx = (xs[a] + xs[a + 1]) / 2, my = (ys[b] + ys[b + 1]) / 2;
        // Ask the surface, not the block list. Proud blocks are grown and win
        // where they overlap sunk ones, so the raw lists would hand the sunk
        // body corners it does not actually own -- and corner-touching squares
        // are exactly what will not close.
        if (Math.abs(reliefAt(p, mx, my) - rel) > 1e-9) continue;
        var cell = [[xs[a], ys[b]], [xs[a + 1], ys[b]],
                    [xs[a + 1], ys[b + 1]], [xs[a], ys[b + 1]]];
        var work = [cell];
        [rel, rel - skin].forEach(function (lv) {
          var next = [];
          work.forEach(function (w) {
            var halves = splitAtCrease(p, w, lv);
            if (!halves) { next.push(w); return; }
            if (halves[0].length >= 3) next.push(halves[0]);
            if (halves[1].length >= 3) next.push(halves[1]);
          });
          work = next;
        });
        work.forEach(function (w) {
          var c = dedupe(w);
          if (c.length < 3) return;

    pts.push([y1, 0], [y1, h], [y0, h]);
    return pts;
  }
  function ribAt(p, x, y0, y1) {
    // No minimum height here: a clamped rib stands proud of the deck and holds
    // the sheet off the rest of the frame. Ribs too short to be worth printing
    // are dropped in build() instead.
    var h = ribTop(p, x) - p.baseH;
    return extrude(ribSection(p, h, y0, y1), x - p.ribThick / 2, x + p.ribThick / 2,
      function (y, z, xx) { return [xx, y, z + p.baseH]; });
  }

  // A rib spans the whole width, so on a narrow bed it has to be split. Cut it
  // over the centre of a base strip: the strip's mortise then holds both halves,
  // and the joint lands on the stiffest line rather than in mid-air.
  function ribCuts(p) {
    var bed = Math.max(80, Math.min(p.bedX || 250, p.bedY || 250));
    var rs = ribSpan(p);
    if (rs[1] - rs[0] <= bed) return [[rs[0], rs[1]]];
    var ys = baseYs(p), mids = ys.map(function (r) { return (r[0] + r[1]) / 2; });
    var cuts = [rs[0]], i, guard = 0;
    while (rs[1] - cuts[cuts.length - 1] > bed && guard++ < 50) {
      var from = cuts[cuts.length - 1], pick = -1;
      for (i = 0; i < mids.length; i++)
        if (mids[i] > from + 20 && mids[i] - from <= bed) pick = mids[i];
      if (pick < 0) pick = from + bed;          // no strip in reach; plain cut
      cuts.push(pick);
    }
    cuts.push(rs[1]);
    var out = [];
    for (i = 0; i + 1 < cuts.length; i++) out.push([cuts[i], cuts[i + 1]]);
    return out;
  }

  // A base strip: a flat bar on the ground with a mortise under every rib it
  // passes. This is the bottom plane, and it is what makes the frame a frame.
  function stripSection(p, x0, x1, stations) {
    var half = p.ribThick / 2 + p.fit, H = p.baseH, T = p.tenon;
    // Clip each mortise to this run rather than dropping it. A mortise that
    // runs off the end becomes an open half -- and two modules butted together
    // make a whole one, so a single rib's feet span the seam and tie them.
    var ms = [], i;
    for (i = 0; i < stations.length; i++) {
      var a = Math.max(stations[i] - half, x0), b = Math.min(stations[i] + half, x1);
      if (b - a > 0.5) ms.push([a, b]);
    }
    ms.sort(function (u, v) { return u[0] - v[0]; });

    // top edge, left to right, stepping down through each mortise
    var top = [], cur = x0;
    for (i = 0; i < ms.length; i++) {
      if (ms[i][0] > cur + 1e-9) top.push([cur, H], [ms[i][0], H]);
      top.push([ms[i][0], H - T], [ms[i][1], H - T]);
      cur = ms[i][1];
    }
    if (cur < x1 - 1e-9) top.push([cur, H], [x1, H]);

    var pts = [[x0, 0], [x1, 0]];
    for (i = top.length - 1; i >= 0; i--) pts.push(top[i]);
    return pts;
  }

  function stripAt(p, x0, x1, stations, y0, y1) {
    return extrude(stripSection(p, x0, x1, stations), y0, y1,
      function (x, z, yy) { return [x, yy, z]; });
  }

  // The edge channel the plywood slides into. Its section changes along the run
  // because it follows the ramp, so it is lofted -- a fixed-topology outline
  // whose z values track the deck, joined station to station.
  //
  //   8---------7        7,8 top of the outer wall
  //   |         6--5     5,6 the lip that traps the sheet
  //   |         |  |     4,5 groove, sheet slides in here
  //   |         3--4
  //   1---------2        1,2 on the ground
  //
  function channelSection(p, x) {
    var zd = Math.max(p.baseH, ribTop(p, x));      // deck underside here
    var t2 = p.sheet + p.plyClear;                 // slot height, slip fit
    var zTop = zd + t2 + p.channelCap;
    var W = p.channelW, g = W - p.grooveDepth;
    var wall = p.channelWall, foot = p.channelFoot, floor = zd - 2;
    // A C-section: foot on the ground, a spine up the outer face, and two arms
    // reaching in to form the groove. Solid through here would be most of the
    // channel's weight and none of its strength.
    return [[0, 0], [W, 0], [W, foot], [wall, foot], [wall, floor], [W, floor],
            [W, zd], [g, zd], [g, zd + t2], [W, zd + t2], [W, zTop], [0, zTop]];
  }

  function channelMesh(p, x0, x1, mirror) {
    var m = mesh(), N = Math.max(8, Math.round((x1 - x0) / 6)), i, k;
    var W = p.hillWidth;
    var place = function (pt, x) {
      var y = mirror ? W - pt[0] : pt[0];
      return [x, y, pt[1]];
    };
    var secs = [];
    for (i = 0; i <= N; i++) {
      var x = x0 + (x1 - x0) * i / N;
      secs.push(channelSection(p, x).map(function (q) { return place(q, x); }));
    }
    var n = secs[0].length;
    for (i = 0; i + 1 < secs.length; i++) {
      for (k = 0; k < n; k++) {
        var j = (k + 1) % n;
        if (mirror) m.quad(secs[i][k], secs[i][j], secs[i+1][j], secs[i+1][k]);
        else        m.quad(secs[i][k], secs[i+1][k], secs[i+1][j], secs[i][j]);
      }
    }
    // caps: the outline is concave at the groove, so triangulate it properly
    var flat = channelSection(p, x0), e0 = earClip(flat.map(function (q) {
      return [q[0], q[1]]; }));
    [[0, x0, true], [secs.length - 1, x1, false]].forEach(function (c) {
      var sec = channelSection(p, c[1]);
      var e = earClip(sec.map(function (q) { return [q[0], q[1]]; }));
      e.tris.forEach(function (tri) {
        var a = place(e.pts[tri[0]], c[1]), b = place(e.pts[tri[1]], c[1]),
            cc = place(e.pts[tri[2]], c[1]);
        if (c[2] !== !!mirror) m.tri(a, b, cc); else m.tri(a, cc, b);
      });
    });
    return m.tris;
  }

  function thresholdMesh(p) {
    var rs = ribSpan(p);
    return prism([[0, 0], [p.endRun, 0], [p.endRun, p.baseH + p.sheet]],
                 rs[0], rs[1]);
  }

  // The bent sheet itself, for the preview: top follows the ramp surface,
  // underside follows the rib tops, so it visibly sits on them.
  function sheetMesh(p) {
    var m = mesh(), N = Math.max(60, Math.round(p.hillLength / 4)), i;
    var ss = sheetSpan(p), L = p.hillLength;
    // Where the ramp is shallower than the sheet is thick, the sheet lies on
    // the ground and its own thickness sets the surface -- so drive the top
    // face off the underside, not off the ramp profile.
    // The sheet's underside is exactly the rib tops, so in the preview the two
    // surfaces z-fight and the ribs show through. This mesh is drawn, never
    // printed, so lift it clear by a hair.
    var bot = function (x) { return Math.max(p.baseH, ribTop(p, x)) + 0.25; };
    var top = function (x) { return bot(x) + p.sheet / Math.cos(slope(p, x)); };
    for (i = 0; i < N; i++) {
      var a = L * i / N, b = L * (i + 1) / N;
      var ta = top(a), tb = top(b), ba = bot(a), bb = bot(b);
      var y0 = ss[0], y1 = ss[1];
      m.quad([a,y0,ta], [b,y0,tb], [b,y1,tb], [a,y1,ta]);      // riding face
      m.quad([a,y0,ba], [a,y1,ba], [b,y1,bb], [b,y0,bb]);      // underside
      m.quad([a,y0,ba], [b,y0,bb], [b,y0,tb], [a,y0,ta]);      // near edge
      m.quad([a,y1,ba], [a,y1,ta], [b,y1,tb], [b,y1,bb]);      // far edge
    }
    var q0 = ss[0], q1 = ss[1];
    m.quad([0,q0,bot(0)], [0,q0,top(0)], [0,q1,top(0)], [0,q1,bot(0)]);
    m.quad([L,q0,bot(L)], [L,q1,bot(L)], [L,q1,top(L)], [L,q0,top(L)]);
    return m.tris;
  }

  function build(opts) {
    var p = Object.assign({}, DEFAULTS, opts || {});
    // Land ribs exactly on crests and troughs: divide the half-hump, which puts
    // a rib at every peak -- most load, tightest bend -- and every low point.
    // A roller's ribs divide the half-hump so one lands on every crest. A
    // module has no crest, so just space them evenly inside the sag limit.
    var oneWay = p.shape === 'rise' || p.shape === 'fall' || p.shape === 'flat';
    var half = oneWay ? p.hillLength : p.hillLength / p.humps / 2;
    var perHalf = Math.max(1, Math.ceil(half / p.maxSpan));
    var step = half / perHalf;
    var n = Math.round(p.hillLength / step) + 1;
    var ribs = [], skipped = 0, ribStation = 0, i, k;
    for (i = 0; i < n; i++) {
      var x = i * step, h = ribTop(p, x) - p.baseH;
      // Near a trough the deck is already down on the base ladder, so a rib
      // there has nothing to carry -- and anything shorter than this is not
      // worth printing.

      for (si2 = 0; si2 < segs.length; si2++) {

        for (k = 1; k < out.length; k += 3) out[k] -= segs[si2][0];
        ribs.push({ name: 'rib_' + (idx < 10 ? '0' : '') + idx +

    }
    // Screws land on the rib's own top face, well inboard of its edges.
    var sy = [], m = p.screwsPerRib;
    for (k = 0; k < m; k++) sy.push(20 + (p.hillWidth - 40) * k / (m - 1));

    // Base strips, cut into bed-length runs. A joint always falls midway
    // between two ribs, so the ribs either side pin it.
    var stations = ribs.map(function (b) { return b.x; })
      .filter(function (v, ix, arr) { return arr.indexOf(v) === ix; });
    var strips = [], ys = baseYs(p), si, sj;
    // Cut by length, not by rib count: ribs are skipped at the troughs, so
    // counting bays lets one segment straddle the gap and overrun the bed.
    var maxSeg = Math.max(120, (p.bedX || 250) - 30);
    var half2 = p.ribThick / 2 + p.fit + 3;
    // Candidate joints: midway between neighbouring ribs, so a rib always pins
    // the joint. Take the furthest candidate that still fits the bed.
    var cand = [];
    for (si = 1; si < stations.length; si++)

    while (p.hillLength - cuts[cuts.length - 1] > maxSeg && safety++ < 200) {
      var from = cuts[cuts.length - 1], pick = -1;
      for (si = 0; si < cand.length; si++)

      if (pick < 0) {
        // no rib gap within reach: cut on plain bar, clear of any mortise

        for (si = 0; si < stations.length; si++)
          if (Math.abs(pick - stations[si]) < half2) pick = stations[si] - half2;
      }
      cuts.push(pick);
    }
    cuts.push(p.hillLength);

    // Normalise: drop any cut that leaves a runt, then split anything left
    // over the bed limit. A greedy walk alone produces both.
    var minSeg = 45, changed = true, gg = 0;
    while (changed && gg++ < 50) {
      changed = false;
      for (si = 1; si < cuts.length; si++) {
        if (cuts[si] - cuts[si - 1] >= minSeg) continue;
        cuts.splice(si === cuts.length - 1 ? si - 1 : si, 1);
        changed = true;
        break;
      }
      for (si = 1; si < cuts.length; si++) {
        if (cuts[si] - cuts[si - 1] <= maxSeg) continue;
        var a3 = cuts[si - 1], b4 = cuts[si];
        var k3 = Math.ceil((b4 - a3) / maxSeg), ins = [];
        for (sj = 1; sj < k3; sj++) ins.push(a3 + (b4 - a3) * sj / k3);
        cuts.splice.apply(cuts, [si, 0].concat(ins));
        changed = true;
        break;
      }
    }

    for (si = 0; si + 1 < cuts.length; si++) {
      for (sj = 0; sj < ys.length; sj++) {
        var tris = stripAt(p, cuts[si], cuts[si + 1], stations, ys[sj][0], ys[sj][1]);
        var out = tris.slice();
        for (k = 0; k < out.length; k += 3) out[k] -= cuts[si];

        // were three of them, and eight strips quietly overwrote each other
        strips.push({ name: 'base_' + si + 'abcdefgh'.charAt(sj),

    var nCh = Math.ceil(p.hillLength / maxCh);
    for (si = 0; si < nCh; si++) {

        var tris = channelMesh(p, ca, cb, !!side), out = tris.slice();
        for (k = 0; k < out.length; k += 3) out[k] -= ca;
        chan.push({ name: 'channel_' + si + (side ? 'R' : 'L'),
                    tris: out, placed: tris, side: side });
      });

    var ss = sheetSpan(p);

  }

  // Everything the viewport draws, already positioned on the ground.
  function parts(r) {
    var p = r.params, out = [];
    r.ribs.forEach(function (b) { out.push({ name: b.name, tris: b.placed, ci: 0, kind: 'rib' }); });
    r.strips.forEach(function (b) { out.push({ name: b.name, tris: b.placed, ci: 2, kind: 'base' }); });
    r.channels.forEach(function (b) { out.push({ name: b.name, tris: b.placed, ci: 3, kind: 'channel' }); });
    // The thresholds lead UP to the deck from the ground, so they belong
    // outside the run. Left inside it they sit buried under the sheet and the
    // ramp just ends at a 9 mm cliff.
    var th = r.threshold.tris, a = th.slice(), b2 = th.slice(), i;
    for (i = 0; i < a.length; i += 3) a[i] -= p.endRun;
    for (i = 0; i < b2.length; i += 3) b2[i] = p.hillLength + p.endRun - b2[i];
    // match the sheet's display lift so the joint reads flush in the preview
    for (i = 2; i < a.length; i += 3) a[i] += 0.25;
    for (i = 2; i < b2.length; i += 3) b2[i] += 0.25;
    out.push({ name: 'threshold (near)', tris: a, ci: 0, kind: 'end', dir: -1 });
    out.push({ name: 'threshold (far)', tris: b2, ci: 0, kind: 'end', dir: 1 });
    out.push({ name: 'plywood deck', tris: r.sheetTris, ci: 1, sheet: true });

  }

  // Filament for the printed parts only -- the sheet is not printed.
  function estimate(r, print) {
    var g = 0, h = 0, plates = 1;
    r.ribs.concat(r.strips).concat(r.channels)
      .concat([r.threshold, r.threshold]).forEach(function (b) {
      var e = BR.estimate(BR.measure(b.tris),
        Object.assign({ infill: 0.25, topLayers: 6, flow: 11, plates: 0 }, print || {}));
      g += e.grams; h += e.hours;
    });
    return { grams: g, hours: h + plates * 0.1 };
  }

  var api = { DEFAULTS: DEFAULTS, build: build, parts: parts, estimate: estimate,
              prof: prof, ribTop: ribTop, sheetMesh: sheetMesh };

  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.BikeRampDeck = api;
})(this);
